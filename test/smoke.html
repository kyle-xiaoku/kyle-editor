<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>KEditor 冒烟测试</title>
    <link rel="stylesheet" href="../demo/assets/demo.css" />
    <style>
      #results { display: flex; flex-direction: column; gap: 6px; }
      .case { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; }
      .case.pass { border-color: #b7e6c9; }
      .case.fail { border-color: #f3c1c1; background: #fff5f5; }
      .case b { flex: none; width: 46px; font-size: 12px; }
      .case.pass b { color: #07c160; }
      .case.fail b { color: #e53e3e; }
      .case code { font-size: 12px; color: #4b5158; word-break: break-all; }
      .status { font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="header"><h1>KEditor 冒烟测试</h1><span class="status" id="summary">运行中…</span></div>
    <main>
      <div class="card" style="margin-bottom: 16px">
        <h2>测试用例</h2>
        <div class="body"><div id="results"></div></div>
      </div>
      <div class="card">
        <h2>被测编辑器（隐藏交互区）</h2>
        <div class="body tight"><div id="editor"></div></div>
      </div>
    </main>

    <script>
      // ?bundle=min → 改用压缩产物跑同一套用例，验证 minify 没有改变行为
      // 取值只有两个分支的常量，不存在注入面
      var BUNDLE = /[?&]bundle=min\b/.test(location.search)
        ? '../dist/keditor.umd.min.js'
        : '../dist/keditor.umd.js'
      window.__TEST_BUNDLE__ = BUNDLE
      document.write('<scr' + 'ipt src="' + BUNDLE + '"></scr' + 'ipt>')
    </script>
    <script>
      const results = document.getElementById('results')
      const summary = document.getElementById('summary')
      const jsErrors = []
      window.addEventListener('error', (e) => jsErrors.push(String(e.message)))
      window.addEventListener('unhandledrejection', (e) => jsErrors.push('promise: ' + String(e.reason)))

      const cases = []
      function check(name, ok, detail) {
        cases.push({ name, ok: !!ok, detail })
        const row = document.createElement('div')
        row.className = 'case ' + (ok ? 'pass' : 'fail')
        row.innerHTML = `<b>${ok ? 'PASS' : 'FAIL'}</b><span>${name}</span><code>${detail ?? ''}</code>`
        results.appendChild(row)
        if (!ok) console.error('CASE FAIL:', name, '|', detail)
      }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      function randomBytes(size) {
        const bytes = new Uint8Array(size)
        ;(window.crypto || window.msCrypto).getRandomValues(bytes.subarray(0, Math.min(size, 65536)))
        for (let i = 65536; i < size; i += 1) bytes[i] = bytes[i % 65536]
        return bytes
      }
      function noiseFile(name, type, size) {
        return new File([randomBytes(size)], name, { type })
      }

      // ---- 准备一个可上传的测试文件 ----
      function makeImageFile(w = 900, h = 600) {
        const canvas = document.createElement('canvas')
        canvas.width = w
        canvas.height = h
        const ctx = canvas.getContext('2d')
        const grad = ctx.createLinearGradient(0, 0, w, h)
        grad.addColorStop(0, '#07c160')
        grad.addColorStop(1, '#2f6fed')
        ctx.fillStyle = grad
        ctx.fillRect(0, 0, w, h)
        ctx.fillStyle = '#fff'
        ctx.font = '48px sans-serif'
        ctx.fillText('KEditor', 40, h / 2)
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(new File([blob], 'smoke-image.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.92)
        })
      }
      function makeVideoFile(size = 1.2 * 1024 * 1024) {
        const bytes = new Uint8Array(size)
        for (let i = 0; i < size; i += 1) bytes[i] = (i * 7) % 251
        return new File([bytes], 'smoke-video.mp4', { type: 'video/mp4' })
      }

      let chunkEvents = 0
      let completeEvents = 0
      const uploader = KEditor.mockAdapter({
        speed: 6,
        latency: 40,
        onEvent: (type) => {
          if (type === 'chunk') chunkEvents += 1
          if (type === 'complete') completeEvents += 1
        },
      })

      const editor = KEditor.create('#editor', {
        value: '<p>初始内容</p>',
        height: 260,
        chunkUploader: uploader, // 分片上传链路
        image: { compress: false },
        upload: { mode: 'chunk', chunkSize: 256 * 1024, concurrency: 3, retries: 2 },
      })

      // ---- 辅助：把光标放到末尾并选中整段 ----
      function selectAll() {
        editor.focus()
        const range = document.createRange()
        range.selectNodeContents(editor.root)
        const sel = window.getSelection()
        sel.removeAllRanges()
        sel.addRange(range)
      }

      async function run() {
        await sleep(60)
        check('实例创建', editor && editor.root && editor.root.getAttribute('contenteditable') === 'true', `id=${editor?.id}`)
        check('初始内容净化输出', editor.getHTML() === '<p>初始内容</p>', editor.getHTML())

        // 富文本指令
        selectAll()
        editor.commands.toggleMark('bold')
        check('加粗生效', /font-weight:\s*bold/.test(editor.getHTML()), editor.getHTML())
        editor.commands.toggleMark('bold')

        selectAll()
        editor.commands.setColor('fore', '#07c160')
        check('字体颜色', /color:\s*rgb\(7,\s*193,\s*96\)|color:\s*#07c160/i.test(editor.getHTML()), editor.getHTML())

        selectAll()
        editor.commands.setFontSize(20)
        check('自定义字号', /font-size:\s*20px/.test(editor.getHTML()), editor.getHTML())

        selectAll()
        editor.commands.setAlign('center')
        check('居中对齐', /text-align:\s*center/.test(editor.getHTML()), editor.getHTML())

        selectAll()
        editor.commands.toggleList('ordered')
        check('有序列表', /<ol/.test(editor.getHTML()), editor.getHTML())
        editor.commands.toggleList('ordered')

        editor.commands.setHeading('h2')
        check('标题转换', /<h2/.test(editor.getHTML()), editor.getHTML())
        editor.commands.setHeading('p')

        selectAll()
        editor.commands.toggleBlockquote()
        check('引用块', /<blockquote/.test(editor.getHTML()), editor.getHTML())
        editor.commands.toggleBlockquote()

        selectAll()
        editor.commands.createLink({ url: 'https://example.com', text: '示例链接', target: true })
        check('插入链接', /<a[^>]+href="https:\/\/example\.com"[^>]*target="_blank"/.test(editor.getHTML()), editor.getHTML())
        editor.commands.removeLink()
        check('移除链接', !/<a /.test(editor.getHTML()), editor.getHTML())

        editor.commands.insertTable(3, 2)
        check('插入表格', /<table[\s\S]*?<td/.test(editor.getHTML()), (editor.getHTML().match(/<t[dh]/g) || []).length + ' 个单元格')

        editor.commands.insertCodeBlock()
        check('插入代码块', /<pre data-k-lang="plaintext"><code[^>]*>/.test(editor.getHTML()), editor.getHTML().slice(0, 80))
        check('plaintext 不做高亮（占位文字原样保留）', !/ke-tok-/.test(editor.getHTML()), editor.getHTML().slice(0, 80))

        editor.commands.insertDivider()
        check('插入分割线', /<hr/.test(editor.getHTML()), '')

        // 撤销 / 重做
        const before = editor.getHTML()
        editor.undo()
        const afterUndo = editor.getHTML()
        check('撤销生效', afterUndo !== before, afterUndo.slice(0, 60))
        editor.redo()
        check('重做生效', editor.getHTML() !== afterUndo, '')

        // XSS 与危险协议
        editor.setContent('<p>x</p><img src=x onerror="alert(1)"><a href="javascript:alert(2)">y</a><script>alert(3)<\/script><iframe src="https://evil.com"></iframe>')
        const safe = editor.getHTML()
        check('事件属性被清除', !/onerror/i.test(safe), safe.slice(0, 90))
        check('javascript: 协议被拦截', !/javascript:/i.test(safe), safe.slice(0, 90))
        check('script/iframe 被移除', !/<script|<iframe/i.test(safe), safe.slice(0, 90))

        // Word 粘贴清洗
        const word = '<p class="MsoNormal"><font size="4" color="#FF0000">Word 文本</font><span style="mso-fareast-font-family:宋体">样式</span></p><o:p>&nbsp;</o:p>'
        const cleaned = KEditor.cleanWordHtml(word)
        editor.setContent(cleaned)
        const out = editor.getHTML()
        check('Word 标签清洗', !/mso-|<o:p|MsoNormal/i.test(out) && /font-size:\s*18px/.test(out), out)

        // 图片分片上传（用 900KB 噪声文件保证多片）
        chunkEvents = 0
        completeEvents = 0
        const imgResult = await editor.media.upload(noiseFile('smoke-image.jpg', 'image/jpeg', 900 * 1024), 'image')
        check('图片上传成功', imgResult && /^blob:/.test(imgResult.url) && /<img src="blob:/.test(editor.getHTML()), `url=${(imgResult?.url || '').slice(0, 40)}…`)
        check('图片走了多分片', chunkEvents > 1 && completeEvents === 1, `分片请求 ${chunkEvents} 次`)
        check('导出清理内部属性', !/data-k-id|contenteditable="false"/.test(editor.getHTML()), '')

        // 视频分片上传（1.2MB / 256KB = 5 片）
        const videoFile = noiseFile('smoke-video.mp4', 'video/mp4', 1.2 * 1024 * 1024)
        chunkEvents = 0
        completeEvents = 0
        const vidResult = await editor.media.upload(videoFile, 'video')
        check('视频上传成功', vidResult && /<video[^>]+controls/.test(editor.getHTML()), (vidResult?.url || '').slice(0, 40))
        check('视频按 256KB 切片', chunkEvents >= 5, `分片数 ${chunkEvents}（1.2MB / 256KB）`)

        // 秒传（同一文件再传一次应命中缓存）
        chunkEvents = 0
        const again = await editor.media.upload(videoFile, 'video')
        check('相同文件秒传', again?.instant === true && chunkEvents === 0, again?.instant ? 'instant=true' : String(again?.instant))

        // 源码模式
        editor.enterSource()
        const formatted = editor.source.value
        check('源码模式打开', editor.sourceMode && /<p>/.test(formatted), formatted.split('\n').length + ' 行')
        check('源码格式化换行', formatted.includes('\n<') || formatted.includes('\n<'), '')
        editor.source.value = '<p>源码改写</p><h3>来自源码模式</h3>'
        editor.exitSource()
        check('源码改写回填', /源码改写/.test(editor.getHTML()) && /<h3>/.test(editor.getHTML()), editor.getHTML())

        // 预览
        editor.openPreview()
        check('预览渲染', editor.previewMode && editor.previewPanel.content.innerHTML.includes('源码改写'), '')
        editor.closePreview()

        // 只读 / 统计 / 事件 / 销毁
        editor.setReadOnly(true)
        check('只读模式', editor.root.getAttribute('contenteditable') === 'false', '')
        editor.setReadOnly(false)

        let changeFired = 0
        editor.on('change', () => (changeFired += 1))
        editor.setContent('<p>触发变更</p>')
        await sleep(240)
        check('change 事件', changeFired > 0, `fired=${changeFired}`)

        const counts = editor.counts()
        check('字数统计', counts.chars > 0 && counts.images >= 0, JSON.stringify(counts))

        // 取消上传
        const slow = KEditor.create(document.createElement('div'), {
          chunkUploader: KEditor.mockAdapter({ speed: 0.6, latency: 200 }),
          upload: { mode: 'chunk', chunkSize: 128 * 1024 },
          image: { compress: false },
        })
        const task = await (async () => {
          const blob = new Blob([randomBytes(700 * 1024)], { type: 'image/png' })
          const p = slow.media.upload(new File([blob], 'slow.png', { type: 'image/png' }), 'image')
          await sleep(120)
          const t = [...slow.media.tasks.values()][0]
          return p.then((r) => ({ r, t }))
        })()
        check('上传中占位块存在', !!task.t && /data-k-id/.test(slow.root.innerHTML), task.t ? 'state=' + task.t.holder.dataset.kState : 'no task')
        task.t.ctrl.abort()
        await task.then
        await sleep(40)
        check('取消后占位块移除', !/data-k-state="uploading"/.test(slow.root.innerHTML), '')
        slow.destroy()

        // 块级提升：光标在标题内时插入媒体不应嵌套进 h2
        editor.setContent('<h2>标题内插图</h2><p>后续段落</p>')
        const h2 = editor.root.querySelector('h2')
        const h2Range = document.createRange()
        h2Range.selectNodeContents(h2)
        h2Range.collapse(false)
        const h2Sel = window.getSelection()
        h2Sel.removeAllRanges()
        h2Sel.addRange(h2Range)
        await editor.upload(noiseFile('in-heading.png', 'image/png', 120 * 1024), 'image')
        check('媒体不嵌套进标题', !editor.root.querySelector('h2 figure') && editor.root.querySelector('h2 + figure'), editor.getHTML().slice(0, 120))
        editor.setContent('<p>恢复</p>')

        // 对外媒体 API
        editor.insertImage('https://example.com/logo.png', '站点图标')
        check('insertImage 按地址插图', /<img src="https:\/\/example\.com\/logo\.png" alt="站点图标"/.test(editor.getHTML()), '')
        editor.insertVideo('https://example.com/a.mp4', '宣传片')
        check('insertVideo 按地址插视频', /<video src="https:\/\/example\.com\/a\.mp4" controls/.test(editor.getHTML()), '')
        const apiUpload = await editor.upload(noiseFile('api-file.png', 'image/png', 300 * 1024))
        check('editor.upload 自动识别类型', apiUpload && /^blob:/.test(apiUpload.url), `url=${(apiUpload?.url || '').slice(0, 36)}…`)
        const pending = editor.upload(noiseFile('pending.png', 'image/png', 2 * 1024 * 1024))
        await sleep(80)
        editor.cancelUploads()
        await pending
        check('cancelUploads 可中断', editor.media.tasks.size === 0 && !/data-k-state="uploading"/.test(editor.getHTML()), `tasks=${editor.media.tasks.size}`)
        editor.root.querySelectorAll('[data-k-media]').forEach((n) => n.remove())

        // 图片气泡工具条
        const mediaNode = editor.root.querySelector('[data-k-media="image"]') || editor.insertImage('https://example.com/x.png', 'x').parentNode
        editor.bubble.show(editor.root.querySelector('[data-k-media="image"]'))
        await sleep(30)
        const bubbleBtns = editor.bubble.el.querySelectorAll('button').length
        check('气泡工具条渲染按钮', !editor.bubble.el.hidden && bubbleBtns >= 8 && !/object HTML/.test(editor.bubble.el.textContent), `${bubbleBtns} 个按钮`)
        editor.bubble.hide()

        // 图片鼠标拖拽缩放
        const rFig = editor.root.querySelector('[data-k-media="image"]')
        const rImg = rFig.querySelector('img')
        rImg.style.width = '50%'
        editor.bubble.show(rFig)
        await sleep(30)
        check('缩放手柄出现', editor.bubble.resizeEl.hidden === false, '')
        check('缩放手柄不在内容区（不污染导出）', !editor.root.contains(editor.bubble.resizeEl), '')
        const handleBox = editor.bubble.resizeEl.getBoundingClientRect()
        const rBefore = rImg.getBoundingClientRect().width
        const cx = handleBox.left + handleBox.width / 2
        const cy = handleBox.top + handleBox.height / 2
        editor.bubble.resizeEl.dispatchEvent(new PointerEvent('pointerdown', { clientX: cx, clientY: cy, button: 0, bubbles: true }))
        editor.bubble.resizeEl.dispatchEvent(new PointerEvent('pointermove', { clientX: cx - 80, clientY: cy, bubbles: true }))
        editor.bubble.resizeEl.dispatchEvent(new PointerEvent('pointerup', { clientX: cx - 80, clientY: cy, bubbles: true }))
        await sleep(20)
        const rAfter = rImg.getBoundingClientRect().width
        check('拖拽向左缩小图片宽度', rBefore > 0 && rAfter < rBefore - 10, `${rBefore.toFixed(1)} → ${rAfter.toFixed(1)}`)
        check('拖拽结束气泡恢复', editor.bubble.el.hidden === false, '')
        editor.bubble.hide()
        check('取消选中后手柄隐藏', editor.bubble.resizeEl.hidden === true, '')

        // 图片对齐：缩小后，工具栏与气泡两条入口都须真正使图片居中
        editor.bubble.show(rFig)
        await sleep(20)
        editor.commands.setAlign('center')
        await sleep(20)
        {
          const rr = rImg.getBoundingClientRect()
          const ff = rFig.getBoundingClientRect()
          const centered = Math.abs((rr.left - ff.left) - (ff.right - rr.right)) < 3
          check('缩小后工具栏居中生效', rImg.style.marginLeft === 'auto' && centered, `ml=${rImg.style.marginLeft}`)
          check('居中后工具栏按钮高亮', editor.getState().align === 'center', String(editor.getState().align))
        }
        editor.bubble.hide()
        editor.root.querySelectorAll('[data-k-media]').forEach((n) => n.remove())

        // 工具栏交互
        const tableBtn = editor.el.querySelector('[data-k-item="table"]')
        tableBtn.click()
        await sleep(20)
        check('表格弹层打开', !editor.popover.el.hidden, '')
        editor.popover.el.querySelector('.ke-table-cell').click()
        await sleep(20)
        check('弹层选择表格', editor.popover.el.hidden && /<table/.test(editor.getHTML()), '')

        selectAll()
        const colorBtn = editor.el.querySelector('[data-k-item="foreColor"]')
        colorBtn.click()
        await sleep(20)
        const swatches = editor.popover.el.querySelectorAll('.ke-sw')
        check('颜色按钮一次点击即展开面板', !editor.popover.el.hidden && swatches.length > 16, `${swatches.length} 个色块`)
        check('颜色面板含分区与自定义取色', !!editor.popover.el.querySelector('.ke-panel-sect') && !!editor.popover.el.querySelector('.ke-sw-picker') && !!editor.popover.el.querySelector('.ke-sw-hex'), '')
        const htmlBeforeColor = editor.getHTML()
        editor.popover.el.querySelectorAll('.ke-sw')[0].click()
        await sleep(20)
        check('选色后上色并关闭面板', editor.popover.el.hidden && /color:\s*(#07c160|rgb\(7, 193, 96\))/i.test(editor.getHTML()), editor.getHTML().slice(0, 80))
        colorBtn.click()
        await sleep(20)
        check('最近使用记录已生效', editor.popover.el.querySelectorAll('.ke-sw-grid').length >= 3, '')
        colorBtn.click()
        await sleep(20)
        check('再次点击同一颜色按钮关闭面板', editor.popover.el.hidden, '')

        // 段落样式面板：标题含义说明
        const headingBtn = editor.el.querySelector('[data-k-item="heading"]')
        headingBtn.click()
        await sleep(20)
        const hdRows = editor.popover.el.querySelectorAll('.ke-hd-row')
        check('段落样式面板 4 个层级', hdRows.length === 4, `${hdRows.length} 行`)
        check('段落样式含用途描述', [...hdRows].every((r) => (r.querySelector('.ke-hd-desc')?.textContent || '').length > 6), '')
        check('标题一说明大标题用途', /大标题/.test([...hdRows].map((r) => r.textContent).join('')), '')
        hdRows[1].click()
        await sleep(20)
        check('选择标题一生成 h1', /<h1/.test(editor.getHTML()) && editor.popover.el.hidden, '')
        const h1Node = editor.root.querySelector('h1')
        const inH1 = document.createRange()
        inH1.selectNodeContents(h1Node.firstChild || h1Node)
        inH1.collapse(true)
        const selH1 = window.getSelection()
        selH1.removeAllRanges()
        selH1.addRange(inH1)
        editor.refresh()
        check('段落按钮文案跟随当前层级', headingBtn.querySelector('.ke-btn-text').textContent === '标题一', headingBtn.querySelector('.ke-btn-text').textContent)
        const h2Row = (() => { headingBtn.click(); return [...editor.popover.el.querySelectorAll('.ke-hd-row')][2] })()
        h2Row.click()
        await sleep(20)
        check('选中标题二生成 h2', /<h2/.test(editor.getHTML()), '')

        // 字号面板
        const fsBtn = editor.el.querySelector('[data-k-item="fontsize"]')
        fsBtn.click()
        await sleep(20)
        check('字号面板打开', editor.popover.el.querySelectorAll('.ke-size-cell').length >= 8, '')
        editor.popover.close()

        // 图片 / 视频：链接插入
        const imageBtn = editor.el.querySelector('[data-k-item="image"]')
        imageBtn.click()
        await sleep(20)
        check('图片面板含本地/链接两个页签', editor.popover.el.querySelectorAll('.ke-tab').length === 2 && !!editor.popover.el.querySelector('.ke-drop'), '')
        editor.popover.el.querySelectorAll('.ke-tab')[1].click()
        await sleep(20)
        const imgUrlInput = [...editor.popover.el.querySelectorAll('.ke-input')][0]
        imgUrlInput.value = 'https://cdn.example.com/a.png'
        imgUrlInput.dispatchEvent(new Event('input'))
        await sleep(20)
        const imgInsert = [...editor.popover.el.querySelectorAll('.ke-btn-primary')].pop()
        check('图片链接合法即启用插入', imgInsert.disabled === false, '')
        imgInsert.click()
        await sleep(30)
        check('网络图片已插入', /src="https:\/\/cdn\.example\.com\/a\.png"/.test(editor.getHTML()) && editor.popover.el.hidden, '')

        const videoBtn = editor.el.querySelector('[data-k-item="video"]')
        videoBtn.click()
        await sleep(20)
        editor.popover.el.querySelectorAll('.ke-tab')[1].click()
        await sleep(20)
        const vUrl = [...editor.popover.el.querySelectorAll('.ke-input')][0]
        vUrl.value = 'https://cdn.example.com/clip.mp4'
        vUrl.dispatchEvent(new Event('input'))
        await sleep(20)
        ;[...editor.popover.el.querySelectorAll('.ke-btn-primary')].pop().click()
        await sleep(30)
        check('网络视频已插入', /<video[^>]+src="https:\/\/cdn\.example\.com\/clip\.mp4"/.test(editor.getHTML()), '')
        editor.root.querySelectorAll('[data-k-media]').forEach((n) => n.remove())

        // 源码模式切换按钮常驻工具栏右侧
        const sourceBtn = editor.el.querySelector('[data-k-item="source"]')
        check('源码按钮存在且带文字', !!sourceBtn && /源码/.test(sourceBtn.textContent), sourceBtn?.textContent || '')
        check('源码按钮固定于尾部', !!sourceBtn.closest('.ke-tb-tail'), '')
        editor.toggleSource()
        await sleep(20)
        check('源码模式置灰正文按钮', editor.el.classList.contains('ke-is-source') && sourceBtn.classList.contains('ke-is-active'), '')
        editor.toggleSource()
        await sleep(20)
        check('退出源码模式恢复', !editor.el.classList.contains('ke-is-source'), '')

        // ---- 工具栏溢出时的可滑动提示 ----
        try { localStorage.removeItem('keditor.toolbarScrollHint') } catch { /* 忽略 */ }
        const narrowWrap = document.createElement('div')
        narrowWrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px'
        document.body.appendChild(narrowWrap)
        const narrow = KEditor.create(narrowWrap, { uploader, value: '<p>x</p>' })
        await sleep(80)
        const ntb = narrow.tbEl
        check(
          '窄屏工具栏确实溢出',
          ntb.scrollWidth > ntb.clientWidth + 1,
          `scrollWidth=${ntb.scrollWidth} clientWidth=${ntb.clientWidth}`,
        )
        check('溢出时标记为可滑动', narrow.el.classList.contains('ke-tb-scrollable'), '')
        check('静止时提示右侧仍有工具', narrow.el.classList.contains('ke-tb-can-r'), '')
        check('静止时不误报左侧', !narrow.el.classList.contains('ke-tb-can-l'), '')
        check('渐隐遮罩已挂载', !!narrow.el.querySelector('.ke-tb-fades'), '')
        check(
          '首次引导气泡出现且文案明确',
          /滑动/.test(narrow.el.querySelector('.ke-tb-hint')?.textContent || ''),
          narrow.el.querySelector('.ke-tb-hint')?.textContent || '无气泡',
        )
        check(
          '工具栏高度变量已写入（遮罩对齐用）',
          /^\d+px$/.test(narrow.el.style.getPropertyValue('--ke-tb-h').trim()),
          narrow.el.style.getPropertyValue('--ke-tb-h'),
        )

        ntb.scrollLeft = ntb.scrollWidth
        await sleep(80)
        check(
          '滑到最右后改为提示左侧',
          narrow.el.classList.contains('ke-tb-can-l') && !narrow.el.classList.contains('ke-tb-can-r'),
          `canL=${narrow.el.classList.contains('ke-tb-can-l')} canR=${narrow.el.classList.contains('ke-tb-can-r')}`,
        )
        const pillOut = narrow.el.querySelector('.ke-tb-hint')
        check('滑动后引导气泡立即进入消失动画', !pillOut || pillOut.classList.contains('ke-is-out'), pillOut?.className || '已移除')
        await sleep(320)
        check('淡出动画结束后移除气泡节点', !narrow.el.querySelector('.ke-tb-hint'), '')
        check(
          '引导已记忆（不重复打扰）',
          (() => {
            try { return localStorage.getItem('keditor.toolbarScrollHint') === '1' } catch { return true }
          })(),
          '',
        )

        // 鼠标拖拽平移
        ntb.scrollLeft = 0
        await sleep(40)
        const dragBefore = ntb.scrollLeft
        ntb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerType: 'mouse', clientX: 300, clientY: 10 }))
        ntb.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerType: 'mouse', clientX: 230, clientY: 10 }))
        ntb.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerType: 'mouse', clientX: 230, clientY: 10 }))
        await sleep(60)
        check('鼠标拖拽可平移工具栏', ntb.scrollLeft > dragBefore, `before=${dragBefore} after=${ntb.scrollLeft}`)

        const fadesRef = narrow.el.querySelector('.ke-tb-fades')
        narrow.destroy()
        check(
          '销毁后清理遮罩与状态类',
          !fadesRef.isConnected && !narrow.el.classList.contains('ke-tb-scrollable'),
          '',
        )
        narrowWrap.remove()

        check('无 JS 运行时错误', jsErrors.length === 0, jsErrors.join(' | ').slice(0, 160))

        // beforeUpload 钩子
        let hookCalled = 0
        const hooked = KEditor.create(document.createElement('div'), {
          chunkUploader: uploader,
          image: { compress: false },
          upload: { mode: 'chunk', chunkSize: 256 * 1024 },
          beforeUpload: (file, kind) => {
            hookCalled += 1
            return kind === 'video' ? false : file
          },
        })
        await hooked.upload(noiseFile('blocked.mp4', 'video/mp4', 200 * 1024))
        check('beforeUpload 可拦截上传', hookCalled === 1 && !/blocked\.mp4/.test(hooked.getHTML()) && hooked.media.tasks.size === 0, `called=${hookCalled}`)
        hooked.destroy()

        // ---- 回归：value 为空时的初始内容 ----
        // 曾经 buildDOM() 先于 setContent 执行，'' || this.el.innerHTML 取到的是编辑器自身 DOM，
        // 导致工具栏/状态栏被塞进正文（所有 demo 都传 value，|| 短路，长期未暴露）
        {
          const emptyHost = document.createElement('div')
          const emptyEd = KEditor.create(emptyHost, { placeholder: 'PH' })
          const emptyRoot = emptyHost.querySelector('[data-ke-root]')
          const emptyHTML = emptyRoot.innerHTML
          check(
            'value 为空时正文不含编辑器自身 DOM',
            !emptyRoot.querySelector('.ke-tb,.ke-status,.ke-preview,.ke-dropzone') && !/ke-tb|ke-status/.test(emptyHTML),
            emptyHTML.slice(0, 90),
          )
          check('value 为空时正文为空占位', emptyHTML === '<p><br></p>' && emptyEd.getText().trim() === '', emptyHTML)
          check('value 为空时 placeholder 生效', emptyRoot.classList.contains('ke-is-empty'), emptyRoot.className)
          emptyEd.destroy()

          // 宿主已有内容 + 不传 value → 继承宿主内容（该 fallback 的设计意图）
          const seedHost = document.createElement('div')
          seedHost.innerHTML = '<p>宿主已有内容</p>'
          const seedEd = KEditor.create(seedHost, {})
          check('宿主内容被继承为初始正文', seedEd.getText().includes('宿主已有内容'), seedEd.getHTML().slice(0, 60))
          check('继承后不含编辑器自身 DOM', !seedHost.querySelector('[data-ke-root] .ke-tb'), '')
          seedEd.destroy()

          // 显式 value 优先于宿主内容
          const prioHost = document.createElement('div')
          prioHost.innerHTML = '<p>宿主内容</p>'
          const prioEd = KEditor.create(prioHost, { value: '<p>显式值</p>' })
          check(
            '显式 value 优先于宿主内容',
            prioEd.getText().includes('显式值') && !prioEd.getText().includes('宿主内容'),
            prioEd.getText().slice(0, 40),
          )
          prioEd.destroy()
        }

        /* ---------------- 上传：普通上传 / 分片上传，两条链路各自配置 ---------------- */
        // 需求：上传分为普通上传与分片上传，可单独配置；分片上传只需一个后端接口，响应里 url 非空即成功
        {
          const upErrorsBefore = jsErrors.length
          const realFetch = window.fetch
          const CS = 64 * 1024
          const mkFile = (size, name = 'a.png', type = 'image/png') => noiseFile(name, type, size)
          // 服务端桩：记录每次请求（普通上传 = 整包，分片上传 = 单片）
          const stub = (rule) => {
            const calls = []
            window.fetch = async (url, init = {}) => {
              const form = init.body instanceof FormData ? init.body : null
              const query = new URL(String(url), location.origin).searchParams
              const call = {
                url: String(url),
                method: init.method,
                form,
                index: Number(form ? form.get('index') : query.get('index')),
                total: Number(form ? form.get('total') : query.get('total')),
                hasIndex: form ? form.has('index') : query.has('index'),
                identifier: form ? form.get('identifier') : query.get('identifier'),
                filename: form ? form.get('filename') : query.get('filename'),
                chunkSize: form ? form.get('chunkSize') : '',
                chunk: form ? form.get('file') : init.body,
              }
              calls.push(call)
              const payload = rule(call, calls) || {}
              return { ok: true, status: 200, statusText: 'OK', text: async () => JSON.stringify(payload) }
            }
            return calls
          }

          try {
            /* ---- 普通上传：整个文件一次请求 ---- */
            {
              const calls = stub(() => ({ data: { url: 'https://cdn.example.com/whole.png' } }))
              const up = KEditor.createSimpleUploader('/api/upload')
              check('普通上传：字符串地址直接可用', up.mode === 'normal' && typeof up.upload === 'function', `mode=${up.mode}`)
              const file = mkFile(CS * 6, 'whole.png')
              const res = await up.upload(file)
              check('普通上传：整个文件只发一次请求', calls.length === 1, `${calls.length} 次请求（文件 ${file.size}B）`)
              check('普通上传：一包发完不分片', calls[0].chunk?.size === file.size && !calls[0].hasIndex, `载荷 ${calls[0].chunk?.size}B / 带 index=${calls[0].hasIndex}`)
              check('普通上传：响应里的 url 即上传结果', res.url === 'https://cdn.example.com/whole.png' && res.mode === 'normal' && res.chunks === 1, String(res.url))
              check(
                '普通上传：multipart 带文件名与体积',
                calls[0].method === 'POST' && calls[0].filename === 'whole.png' && Number(calls[0].form.get('fileSize')) === file.size && !calls[0].identifier,
                `method=${calls[0].method} filename=${calls[0].filename} size=${calls[0].form.get('fileSize')}`,
              )
            }

            // 普通上传：接口没返回 url → 必须失败，不能静默当成功
            {
              stub(() => ({}))
              let err = ''
              try {
                await KEditor.createSimpleUploader({ url: '/api/upload' }).upload(mkFile(CS * 2))
              } catch (e) {
                err = e.message
              }
              check('普通上传：接口没有 url 视为失败', /未返回 url/.test(err), err.slice(0, 70))
            }

            // 普通上传：raw 模式（裸 body + 查询串）与函数写法
            {
              const calls = stub(() => ({ payload: { filePath: 'https://cdn.example.com/raw.bin' } }))
              const up = new KEditor.SimpleUploader(KEditor.httpAdapter({ url: '/api/put', mode: 'raw', pickUrl: (json) => json?.payload?.filePath || '' }))
              const res = await up.upload(mkFile(CS * 3, 'raw.bin'))
              check('普通上传：raw 模式把文件名放进查询串', res.url === 'https://cdn.example.com/raw.bin' && /filename=raw\.bin/.test(calls[0].url), calls[0].url)
              check('普通上传：raw 模式整包 PUT', calls[0].method === 'PUT' && calls[0].chunk?.size === CS * 3, `${calls[0].method} ${calls[0].chunk?.size}B`)
              const fnUp = KEditor.createSimpleUploader((file) => `https://cdn.example.com/${file.name}`)
              const fnRes = await fnUp.upload(mkFile(1024, 'fn.png'))
              check('普通上传：函数写法 = 一次请求直传', fnRes.url === 'https://cdn.example.com/fn.png', String(fnRes.url))
            }

            /* ---- A. 分片上传：只配一个地址 ---- */
            {
              const calls = stub((c) => (c.index === 2 ? { data: { url: 'https://cdn.example.com/a.png', key: 'k/a.png' } } : {}))
              const up = KEditor.createChunkUploader('/api/upload', { chunkSize: CS, concurrency: 1, retries: 0 })
              check('字符串地址 = 单接口分片上传', up.adapter.completeOnUrl === true && up.mode === 'chunk', `completeOnUrl=${up.adapter.completeOnUrl}`)
              const res = await up.upload(mkFile(CS * 6))
              check('单接口：接口返回 url 即上传成功', res.url === 'https://cdn.example.com/a.png', String(res.url))
              check('单接口：命中后不再上传剩余分片', calls.length === 3, `${calls.length} 次请求 / 共 6 片`)
              check(
                '单接口：分片走 multipart 且上下文齐全',
                calls.every((c) => c.form && c.method === 'POST' && c.identifier && c.filename === 'a.png' && c.total === 6 && Number(c.chunkSize) === CS && c.chunk?.size > 0),
                `method=${calls[0].method} total=${calls[0].total} filename=${calls[0].filename} chunk=${calls[0].chunk?.size}B`,
              )
              check('单接口：所有分片打到同一个地址', new Set(calls.map((c) => c.url)).size === 1, `${calls[0].url} ×${calls.length}`)
            }

            // B. 接口全程不返回 url → 必须失败，不能静默当成功
            {
              const calls = stub(() => ({}))
              let err = ''
              try {
                await KEditor.createChunkUploader({ type: 'http', url: '/api/upload' }, { chunkSize: CS, concurrency: 1, retries: 0 }).upload(mkFile(CS * 3))
              } catch (e) {
                err = e.message
              }
              check('单接口：接口没有 url 视为失败', /未返回 url/.test(err), err.slice(0, 70))
              check('单接口：失败前每个分片都尝试过', calls.length === 3, `${calls.length}/3 片`)
            }

            // C. 秒传：首个响应就带 url
            {
              const calls = stub(() => ({ url: 'https://cdn.example.com/instant.png' }))
              const res = await KEditor.createChunkUploader('/api/upload', { chunkSize: CS, concurrency: 2, retries: 0 }).upload(mkFile(CS * 4))
              check('单接口：一上来就有 url 立即结束', res.url === 'https://cdn.example.com/instant.png', String(res.url))
              check('单接口：立即结束后不再发剩余分片', calls.length <= 2, `${calls.length} 次请求（并发 2 / 共 4 片）`)
            }

            // D. 自定义取 url 规则 + raw 模式（地址带查询串）
            {
              const calls = stub(() => ({ code: 0, payload: { filePath: 'https://cdn.example.com/x.mp4' } }))
              const up = new KEditor.ChunkUploader(
                KEditor.httpAdapter({ url: '/api/upload', mode: 'raw', pickUrl: (json) => json?.payload?.filePath || '' }),
                { chunkSize: CS, concurrency: 1, retries: 0 },
              )
              const res = await up.upload(mkFile(CS * 2, 'x.mp4', 'video/mp4'))
              check('单接口：支持自定义取 url 字段', res.url === 'https://cdn.example.com/x.mp4', String(res.url))
              check(
                '单接口：raw 模式把上下文放在查询串',
                /[?&]index=0&/.test(calls[0]?.url || '') && /filename=x\.mp4/.test(calls[0]?.url || ''),
                calls[0]?.url,
              )
            }

            // E. 已移除的三接口模式：旧配置必须明确报错，而不是静默失效
            {
              let err = ''
              try {
                KEditor.httpAdapter({ initUrl: '/init', chunkUrl: '/chunk', completeUrl: '/complete' })
              } catch (e) {
                err = e.message
              }
              check('三接口字段已移除并给出迁移提示', /单接口/.test(err) && /initUrl/.test(err), err.slice(0, 72))
              let err2 = ''
              try {
                KEditor.createChunkUploader({})
              } catch (e) {
                err2 = e.message
              }
              check('分片上传未给接口地址时报错', /缺少接口地址/.test(err2), err2.slice(0, 60))
            }

            // F. 编辑器内端到端：按体积在两条链路之间自动选路
            {
              const calls = stub((c) => (c.hasIndex ? (c.index === c.total - 1 ? { data: { url: 'https://cdn.example.com/e2e.png' } } : {}) : { data: { url: 'https://cdn.example.com/whole.png' } }))
              const hostE = document.createElement('div')
              hostE.style.cssText = 'position:fixed;left:-9999px;top:0;width:820px'
              document.body.appendChild(hostE)
              const edE = KEditor.create(hostE, {
                value: '',
                uploader: '/api/upload', // 普通上传
                chunkUploader: '/api/chunk', // 分片上传
                upload: { mode: 'auto', chunkThreshold: CS * 4, chunkSize: CS, concurrency: 2, retries: 0 },
                image: { compress: false },
              })
              check('选路：小于阈值走普通上传', edE.uploader.pick(mkFile(CS)) === 'normal', `阈值 ${CS * 4}B`)
              check('选路：达到阈值走分片上传', edE.uploader.pick(mkFile(CS * 4)) === 'chunk', '')
              const small = await edE.media.upload(mkFile(CS * 2, 'small.png'), 'image')
              check('编辑器：小文件一次请求拿到地址', calls.length === 1 && small?.url === 'https://cdn.example.com/whole.png', `${calls.length} 次 / ${small?.url}`)
              check('编辑器：小文件打的是普通上传接口', calls[0]?.url === '/api/upload', calls[0]?.url)
              calls.length = 0
              const big = await edE.media.upload(mkFile(CS * 8, 'big.png'), 'image')
              check('编辑器：大文件走分片上传接口', calls.length > 1 && calls.every((c) => c.url === '/api/chunk'), `${calls.length} 次 / ${calls[0]?.url}`)
              check('编辑器：大文件拿到分片接口给的地址', big?.url === 'https://cdn.example.com/e2e.png' && big?.mode === 'chunk', `${big?.url} / ${big?.mode}`)
              check('正文图片使用接口返回的地址', /src="https:\/\/cdn\.example\.com\/(e2e|whole)\.png"/.test(edE.getHTML()), edE.getHTML().slice(0, 110))
              check('上传结束后不残留占位块', edE.media.tasks.size === 0, String(edE.media.tasks.size))
              edE.destroy()
              hostE.remove()
              check('上传流程无新增运行时错误', jsErrors.length === upErrorsBefore, jsErrors.slice(upErrorsBefore).join(' | ').slice(0, 200))
            }

            // G. 强制链路 / 缺分片接口时的回退
            {
              stub(() => ({ url: 'https://cdn.example.com/force.png' }))
              const mk = (opts) => KEditor.create(document.createElement('div'), { value: '', image: { compress: false }, ...opts })
              const forceNormal = mk({ uploader: '/api/upload', chunkUploader: '/api/chunk', upload: { mode: 'normal', chunkThreshold: 0, chunkSize: CS, concurrency: 1, retries: 0 } })
              check('mode=normal：大文件也走普通上传', forceNormal.uploader.pick(mkFile(CS * 9)) === 'normal', '')
              const forceChunk = mk({ uploader: '/api/upload', chunkUploader: '/api/chunk', upload: { mode: 'chunk', chunkThreshold: 1e9, chunkSize: CS, concurrency: 1, retries: 0 } })
              check('mode=chunk：小文件也走分片上传', forceChunk.uploader.pick(mkFile(CS)) === 'chunk', '')
              const forced = await forceChunk.media.upload(mkFile(CS * 3, 'force.png'), 'image')
              check('强制分片链路端到端可用', forced?.url === 'https://cdn.example.com/force.png' && forced?.mode === 'chunk', `${forced?.url} / ${forced?.mode}`)
              const warns = []
              const realWarn = console.warn
              console.warn = (...args) => warns.push(args.join(' '))
              const noChunk = mk({ chunkUploader: null, upload: { mode: 'chunk' } })
              console.warn = realWarn
              check(
                '未配置分片接口时回退普通上传并告警',
                noChunk.uploaders.chunk === null && noChunk.uploader.pick(mkFile(CS * 9)) === 'normal' && /chunkUploader/.test(warns.join(' ')),
                warns.join(' ').slice(0, 64),
              )
              const noChunk2 = mk({ chunkUploader: null, upload: { mode: 'auto', chunkThreshold: 0 } })
              check('未配置分片接口时全部走普通上传', noChunk2.uploader.pick(mkFile(CS * 9)) === 'normal', '')
              for (const ed of [forceNormal, forceChunk, noChunk, noChunk2]) ed.destroy()
            }

            // H. 只配一条链路时的默认行为（不能让另一条静默留在 mock 上）
            {
              const mk = (opts) => KEditor.create(document.createElement('div'), { value: '', image: { compress: false }, ...opts })
              const onlyNormal = mk({ uploader: '/api/upload' })
              check('只配普通上传：不启用分片', onlyNormal.uploaders.chunk === null && onlyNormal.uploader.pick(mkFile(CS * 9)) === 'normal', `chunk=${onlyNormal.uploaders.chunk}`)
              const onlyChunk = mk({ chunkUploader: '/api/chunk' })
              check('只配分片上传：小文件也走分片（不会落到默认 mock）', onlyChunk.uploader.pick(mkFile(1024)) === 'chunk' && onlyChunk.options.upload.mode === 'chunk', `mode=${onlyChunk.options.upload.mode}`)
              const both = mk({ uploader: '/api/upload', chunkUploader: '/api/chunk' })
              check('两条都配：按体积自动选', both.uploader.pick(mkFile(1024)) === 'normal' && both.uploader.pick(mkFile(8 * 1024 * 1024)) === 'chunk', '')
              const none = mk({})
              check('都不配：默认两条都是 mock', none.uploaders.chunk !== null && none.uploader.pick(mkFile(8 * 1024 * 1024)) === 'chunk', '')
              const chunkMock = mk({ uploader: '/api/upload', chunkUploader: 'mock' })
              check('显式写 mock 时以用户配置为准', chunkMock.uploaders.chunk !== null && chunkMock.uploader.pick(mkFile(8 * 1024 * 1024)) === 'chunk', '')
              for (const ed of [onlyNormal, onlyChunk, both, none, chunkMock]) ed.destroy()
            }
          } finally {
            window.fetch = realFetch
          }
        }

        // 默认配置：uploader / chunkUploader 默认都是 mock，小文件普通、大文件分片
        {
          const hostD = document.createElement('div')
          hostD.style.cssText = 'position:fixed;left:-9999px;top:0;width:820px'
          document.body.appendChild(hostD)
          const edD = KEditor.create(hostD, { value: '', image: { compress: false } })
          check('默认配置：两条链路都已装配', typeof edD.uploaders.normal?.upload === 'function' && typeof edD.uploaders.chunk?.upload === 'function', `chunk=${!!edD.uploaders.chunk}`)
          check('默认配置：1MB 图片走普通上传', edD.uploader.pick(new File([new Uint8Array(1024 * 1024)], 'a.png')) === 'normal', '阈值 5MB')
          check('默认配置：8MB 视频走分片上传', edD.uploader.pick(new File([new Uint8Array(8 * 1024 * 1024)], 'a.mp4')) === 'chunk', '阈值 5MB')
          const r = await edD.media.upload(noiseFile('tiny.png', 'image/png', 200 * 1024), 'image')
          check('默认配置：小文件上传成功且走普通链路', /^blob:/.test(r?.url || '') && r?.mode === 'normal', `${(r?.url || '').slice(0, 22)}… / ${r?.mode}`)
          edD.destroy()
          hostD.remove()
        }

        /* ---------------- 自定义工具栏按钮 ---------------- */
        const errorsBefore = jsErrors.length
        const offscreen = (w = 820) => {
          const el = document.createElement('div')
          el.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px`
          document.body.appendChild(el)
          return el
        }

        // A. 静态配置 + 链接模板
        {
          const hostA = offscreen()
          const edA = KEditor.create(hostA, {
            value: '<p>正文</p>',
            customButtons: [{
              name: 'tpl',
              text: '模板',
              title: '插入模板',
              searchable: true,
              options: [
                { value: 'a', label: '开场白', desc: '常用开头', url: 'https://example.com/a' },
                { value: 'b', label: '结束语', group: '结尾' },

          check('front matter 被丢弃', KEditor.markdownToHtml(md(['---', 'title: x', '---', '# 标题'])) === '<h1>标题</h1>', KEditor.markdownToHtml(md(['---', 'title: x', '---', '# 标题'])))
          check('markdownSummary 统计块级元素', (() => { const s = KEditor.markdownSummary(mdHtml); return s.headings === 2 && s.lists === 3 && s.items === 4 && s.codeBlocks === 1 && s.tables === 1 && s.quotes === 1 && s.images === 1 })(), JSON.stringify(KEditor.markdownSummary(mdHtml)))
          check('gfm:false 关闭表格/删除线/裸链接', !/<table/.test(KEditor.markdownToHtml(md(['| a |', '| --- |', '| 1 |']), { gfm: false })) && KEditor.markdownToHtml('~~x~~', { gfm: false }) === '<p>~~x~~</p>' && KEditor.markdownToHtml('见 https://x.com', { gfm: false }) === '<p>见 https://x.com</p>', '')

          const injected = KEditor.markdownToHtml(md(['正文', '', '<scr' + 'ipt>alert(1)</scr' + 'ipt>', '', '<img src=x onerror' + '=alert(1)>', '', '[a](javascript:alert(1))']))
          check('XSS：脚本/事件属性/危险协议全清掉', !/<script/i.test(injected) && !/onerror/i.test(injected) && !/javascript:/i.test(injected) && /&lt;script&gt;/.test(injected), injected.slice(0, 90))
          check('未授权行内标签按文本转义', /<p>&lt;blink&gt;x&lt;\/blink&gt;<\/p>/.test(KEditor.markdownToHtml('<blink>x</blink>')), KEditor.markdownToHtml('<blink>x</blink>'))
          check('未知语言退化纯文本（不丢内容）', KEditor.markdownToHtml(md([fence + 'brainfuck', '+++.', fence])) === '<pre><code>+++.</code></pre>', KEditor.markdownToHtml(md([fence + 'brainfuck', '+++.', fence])))
          check('空输入不报错', KEditor.markdownToHtml('') === '' && KEditor.markdownSummary('').headings === 0, '')
          check('isMarkdownFile 判定（含 .txt / 排除图片）', KEditor.isMarkdownFile({ name: 'a.md', type: '' }) && KEditor.isMarkdownFile({ name: 'a.txt', type: 'text/plain' }) && !KEditor.isMarkdownFile({ name: 'a.md', type: 'image/png' }) && !KEditor.isMarkdownFile(null), '')
          check('normalizeInsertMode 归一', KEditor.normalizeInsertMode('append') === 'append' && KEditor.normalizeInsertMode('cursor') === 'cursor' && KEditor.normalizeInsertMode('nope') === 'replace', '')

          const hostMd = offscreen()
          const edMd = KEditor.create(hostMd, { value: '<p>原有内容</p>' })
          await sleep(30)
          const mdBtn = hostMd.querySelector('.ke-tb [data-k-item="markdown"]')
          const mdPop = () => hostMd.querySelector('.ke-pop')
          check('工具栏有导入按钮且位于尾部区', !!mdBtn && mdBtn.closest('.ke-tb-tail') !== null, mdBtn ? mdBtn.parentElement.className : 'null')
          // 回归：按钮曾只显图标且图标是「外框 M + 箭头」，17px 下糊成一团、看不出功能
          const mdIco = mdBtn.querySelector('svg.ke-ico')
          const icoD = mdIco?.querySelector('path')?.getAttribute('d') || ''
          check('导入按钮文案为「导入MD」', mdBtn.querySelector('.ke-btn-text')?.textContent === '导入MD', mdBtn.textContent.trim())
          check('图标是托盘+下箭头（不再用挤作一团的外框 M）', !!mdIco && !mdIco.querySelector('rect') && icoD.indexOf('M12 3.8v') === 0, icoD.slice(0, 24))
          check('按钮提示说明用途', /导入 Markdown/.test(mdBtn.title), mdBtn.title)
          mdBtn.click()
          await sleep(60)
          check('打开导入面板（含页签/模式/预览）', /导入 Markdown/.test(mdPop()?.querySelector('.ke-panel-title')?.textContent || '') && mdPop().querySelectorAll('.ke-tab').length === 2 && mdPop().querySelectorAll('.ke-md-mode').length === 3 && !!mdPop().querySelector('.ke-md-preview'), '')
          check('默认落点为替换全文', mdPop().querySelector('.ke-md-mode.ke-is-active')?.textContent === '替换全文', mdPop().querySelector('.ke-md-mode.ke-is-active')?.textContent)
          check('空态禁用导入并给出提示', mdPop().querySelector('.ke-btn-primary').disabled === true && /会显示转换预览/.test(mdPop().querySelector('.ke-md-preview').textContent), '')
          mdPop().querySelectorAll('.ke-tab')[1].click()
          const mdText = mdPop().querySelector('.ke-md-text')
          mdText.value = md(['# 面板导入', '', '正文'])
          mdText.dispatchEvent(new Event('input'))
          await sleep(280)
          check('粘贴文本后实时预览', !!mdPop().querySelector('.ke-md-preview h1') && mdPop().querySelector('.ke-panel-note').textContent.includes('字符'), mdPop().querySelector('.ke-panel-note').textContent)
          // 回归：面板曾被预览里的宽表格 / 长链接撑宽，且变高后底部按钮被挤出可视区
          const mdPanel = () => mdPop().querySelector('.ke-md-panel')
          const panelWidth = () => Math.round(mdPanel().getBoundingClientRect().width)
          const widthBefore = panelWidth()
          mdText.value = md([
            '# 面板导入', '', '正文', '',
            '| 很宽的列一 | 很宽的列二 | 很宽的列三 | 很宽的列四 | 很宽的列五 | 很宽的列六 |',
            '| --- | :--: | ---: | --- | --- | --- |',
            '| a | b | c | d | e | f |', '',
            `见 https://example.com/${'segment/'.repeat(12)}end`,
            '', fence + 'js', 'const padding = ' + 1, fence,
          ])
          mdText.dispatchEvent(new Event('input'))
          await sleep(300)
          check('面板宽度固定：宽表格 / 长链接不会把弹层撑宽', panelWidth() === widthBefore && panelWidth() <= 372, `${widthBefore} → ${panelWidth()}`)
          check('预览被约束在面板内（不反向撑开面板）', (() => {
            const pw = mdPanel().getBoundingClientRect().width
            return mdPanel().querySelector('.ke-md-preview').getBoundingClientRect().width <= pw
          })(), '')
          check('面板高度有上限且底部按钮钉在面板内', (() => {
            const panel = mdPanel()
            const pb = panel.getBoundingClientRect()
            const foot = panel.querySelector('.ke-panel-foot').getBoundingClientRect()
            const cap = parseFloat(getComputedStyle(panel).maxHeight) + 1
            const body = panel.querySelector('.ke-md-body')
            return Math.round(pb.height) <= cap && foot.bottom <= pb.bottom + 1 && foot.top >= pb.top && !!body
          })(), `h=${Math.round(mdPanel().getBoundingClientRect().height)} cap=${getComputedStyle(mdPanel()).maxHeight}`)
          mdText.value = md(['# 面板导入', '', '正文'])
          mdText.dispatchEvent(new Event('input'))
          await sleep(60)
          mdPop().querySelectorAll('.ke-md-mode')[1].click()
          check('可改落点为追加文末', mdPop().querySelector('.ke-md-mode.ke-is-active')?.textContent === '追加文末', '')
          mdPop().querySelector('.ke-btn-primary').click()
          await sleep(120)
          check('导入后关闭面板', !mdPop().offsetParent, '')
          check('追加模式：原内容保留 + 新内容到位', /原有内容/.test(edMd.getHTML()) && /面板导入/.test(edMd.getHTML()), edMd.getHTML().slice(0, 50))

          const mdFile = new File([md(['# 文件导入', '', fence + 'python', 'def f():', '    return 1', fence])], 'readme.md', { type: 'text/markdown' })
          const fileRes = await edMd.importMarkdown(mdFile)
          check('importMarkdown(File) 默认替换全文并报文件名', fileRes.ok === true && fileRes.mode === 'replace' && fileRes.name === 'readme.md' && !/面板导入/.test(edMd.getHTML()), JSON.stringify({ ok: fileRes.ok, mode: fileRes.mode, name: fileRes.name }))
          check('文件导入的代码块已高亮', edMd.root.querySelectorAll('pre span[class*="ke-tok-"]').length > 0 && edMd.root.querySelector('pre').getAttribute('data-k-lang') === 'python', edMd.root.querySelector('pre')?.getAttribute('data-k-lang'))
          check('返回结构含 summary/chars', fileRes.summary?.headings === 1 && fileRes.chars > 0, JSON.stringify(fileRes.summary))
          check('导出产物无高亮 token、保留语言标记', !/ke-tok-/.test(edMd.getHTML()) && /<pre data-k-lang="python"><code class="language-python">/.test(edMd.getHTML()), edMd.getHTML().slice(0, 70))
          check('导出产物不含内部属性', !/data-k-id|contenteditable/.test(edMd.getHTML()), '')

          edMd.setContent('<p>甲乙丙</p>')
          const insRes = await edMd.insertMarkdown('## 光标处标题')
          check('insertMarkdown 插入光标处且保留原内容', insRes.mode === 'cursor' && /甲乙丙/.test(edMd.getHTML()) && /光标处标题/.test(edMd.getHTML()), edMd.getHTML().slice(0, 60))
          const appRes = await edMd.appendMarkdown(md(['- 末尾列表', '- 第二项']))
          check('appendMarkdown 追加到文末', appRes.mode === 'append' && /末尾列表/.test(edMd.getHTML()), edMd.getHTML().slice(-50))
          const setRes = await edMd.setMarkdown('只留这一段')
          check('setMarkdown 替换全文', setRes.ok && edMd.getHTML() === '<p>只留这一段</p>', edMd.getHTML())
          check('markdownOptions() 反映配置', edMd.markdownOptions().insertMode === 'replace', JSON.stringify(edMd.markdownOptions()))
          const beforeEmpty = edMd.getHTML()
          const emptyRes = await edMd.importMarkdown('   ')
          check('空内容导入失败且不改动正文', emptyRes.ok === false && edMd.getHTML() === beforeEmpty, JSON.stringify({ ok: emptyRes.ok, reason: emptyRes.reason }))

          const hostMd2 = offscreen()
          const edMd2 = KEditor.create(hostMd2, { value: '<p>底稿</p>', markdown: { insertMode: 'append' } })
          await sleep(30)
          check('markdown.insertMode 选项影响默认落点', edMd2.markdownOptions().insertMode === 'append', edMd2.markdownOptions().insertMode)
          await edMd2.importMarkdown('# 追加标题')
          check('默认落点=追加时不覆盖正文', /底稿/.test(edMd2.getHTML()) && /追加标题/.test(edMd2.getHTML()), edMd2.getHTML().slice(0, 50))
          edMd2.destroy()
          hostMd2.remove()

          const hostMd3 = offscreen()
          const edMd3 = KEditor.create(hostMd3, { markdown: { maxSize: 16 } })
          await sleep(30)
          const bigRes = await edMd3.importMarkdown(new File(['x'.repeat(120)], 'big.md', { type: 'text/markdown' }))
          check('超出 markdown.maxSize 被拒绝', bigRes.ok === false && /超出大小限制/.test(document.body.textContent), String(bigRes.ok))
          edMd3.destroy()
          hostMd3.remove()

          const hostMd4 = offscreen()
          const edMd4 = KEditor.create(hostMd4, { code: { highlight: false } })
          await sleep(30)
          await edMd4.importMarkdown(md([fence + 'js', 'const a = 1', fence]))
          check('code.highlight:false 时导入不高亮但保留语言标记', edMd4.root.querySelectorAll('pre span[class*="ke-tok-"]').length === 0 && edMd4.root.querySelector('pre').getAttribute('data-k-lang') === 'javascript', '')
          edMd4.destroy()
          hostMd4.remove()

          const hostMd5 = offscreen()
          const edMd5 = KEditor.create(hostMd5, { readOnly: true })
          await sleep(30)
          const roRes = await edMd5.importMarkdown('# 只读')
          check('只读模式拒绝导入', roRes.ok === false && roRes.reason === 'readonly', JSON.stringify(roRes))
          edMd5.destroy()
          hostMd5.remove()

          edMd.destroy()
          hostMd.remove()
          check('Markdown 流程无新增运行时错误', jsErrors.length === errorsBeforeMd, jsErrors.slice(errorsBeforeMd).join(' | ').slice(0, 200))
        }

        editor.destroy()
        check('销毁后清空容器', document.getElementById('editor').innerHTML === '' && !document.getElementById('editor').classList.contains('ke'), '')

        const failed = cases.filter((c) => !c.ok)
        summary.textContent = `${cases.length - failed.length}/${cases.length} 通过` + (failed.length ? ` · ${failed.length} 失败` : '')
        summary.style.color = failed.length ? '#e53e3e' : '#07c160'
        window.__TEST_DONE__ = true
        window.__TEST_ERRORS__ = jsErrors
        window.__TEST_FAILED__ = failed.map((c) => `${c.name} :: ${c.detail ?? ''}`)
      }

      run().catch((error) => {
        summary.textContent = '测试异常：' + error.message
        summary.style.color = '#e53e3e'
        check('运行未抛异常', false, error.stack || error.message)
        window.__TEST_DONE__ = true
        window.__TEST_FAILED__ = ['crash: ' + error.message]
      })
    </script>
  </body>
</html>
