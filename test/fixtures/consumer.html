<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消费者安装验证</title>
<style>body{font-family:-apple-system,sans-serif;margin:24px}#log{font-size:12px;color:#666;white-space:pre-wrap}</style>
</head>
<body>
<h3>从 npm 安装后的产物验证</h3>
<div id="umd-box"></div>
<div id="esm-box"></div>
<div id="vue-box"></div>
<div id="log"></div>

<!-- 路径 1：UMD <script> 引入 -->
<script src="node_modules/kyle-editor/dist/keditor.umd.js"></script>
<script>window.__UMD_RAW = window.KEditor</script>
<!-- 压缩产物（unpkg/jsdelivr 的实际入口）后加载，window.KEditor 最终指向它，
     后面的用例跑的正是 CDN 用户拿到的那份代码 -->
<script src="node_modules/kyle-editor/dist/keditor.umd.min.js"></script>
<script>window.__UMD_MIN = window.KEditor</script>
<script src="node_modules/vue/dist/vue.global.prod.js"></script>
<script src="node_modules/kyle-editor/dist/keditor-vue.umd.js"></script>

<script type="module">
const results = []
const ok = (name, cond, extra) => results.push({ name, pass: !!cond, extra: extra === undefined ? null : String(extra) })
const log = (s) => { document.getElementById('log').textContent += s + '\n' }
window.__RESULT = { done: false, results }

/* ---------------- 1. UMD 全局 ---------------- */
ok('UMD 全局 KEditor 存在', typeof window.KEditor === 'object' && typeof window.KEditor.create === 'function')
ok('UMD version 可读', !!window.KEditor.version, window.KEditor && window.KEditor.version)

/* ------- 1b. 压缩产物：必须与未压缩产物行为等价 ------- */
ok('压缩产物同样暴露 window.KEditor',
   typeof window.__UMD_MIN === 'object' && typeof window.__UMD_MIN.create === 'function')
{
  const keys = (o) => Object.keys(o || {}).sort().join(',')
  const rawKeys = keys(window.__UMD_RAW)
  const minKeys = keys(window.__UMD_MIN)
  ok('压缩产物导出清单与未压缩版一致（minify 未丢导出）',
     !!rawKeys && rawKeys === minKeys,
     rawKeys === minKeys ? `${minKeys.split(',').length} 个导出` : `raw=${rawKeys} | min=${minKeys}`)
  ok('压缩产物 version 与未压缩版一致',
     window.__UMD_MIN && window.__UMD_MIN.version === (window.__UMD_RAW || {}).version,
     `${(window.__UMD_RAW || {}).version} / ${window.__UMD_MIN && window.__UMD_MIN.version}`)
}

/* ---------------- 2. 真实创建 + 文档承诺的 API ---------------- */
let editor = null
try {
  editor = window.KEditor.create('#umd-box', { value: '', uploader: 'mock' })
  ok('KEditor.create 返回实例', !!editor && typeof editor.getHTML === 'function')
} catch (e) {
  ok('KEditor.create 返回实例', false, e.message)
}

if (editor) {
  ok('工具栏已渲染', document.querySelectorAll('#umd-box .ke-tb button').length > 10,
     document.querySelectorAll('#umd-box .ke-tb button').length)
  ok('CSS 随 JS 注入', Array.from(document.querySelectorAll('style')).some((s) => s.textContent.includes('ke-tb')))

  // setContent / getHTML / getText / getJSON
  editor.setContent('<h1>标题一</h1><p>正文<strong>加粗</strong>内容</p>')
  const html = editor.getHTML()
  ok('setContent/getHTML 往返', html.includes('<h1>') && html.includes('<strong>'), html.slice(0, 90))
  ok('getText 提取纯文本', editor.getText().includes('正文'), editor.getText().slice(0, 40))
  ok('getJSON 返回 {html,text,counts}', (() => { const j = editor.getJSON(); return j && typeof j.html === 'string' && typeof j.text === 'string' && !!j.counts })())
  ok('counts() 字数统计', editor.counts().chars > 0, JSON.stringify(editor.counts()))

  // XSS 净化
  editor.setContent('<p onclick="alert(1)">安全测试</p><img src="x.png" onerror="alert(2)">')
  const clean = editor.getHTML()
  ok('sanitize 移除 onclick/onerror', !/on(click|error)\s*=/i.test(clean), clean.slice(0, 140))

  // 源码模式（enterSource / exitSource / toggleSource）
  editor.setContent('<p>源码测试</p>')
  editor.enterSource()
  ok('enterSource 进入源码模式', editor.sourceMode === true && !!document.querySelector('.ke-source, textarea'))
  editor.exitSource()
  ok('exitSource 退出源码模式', editor.sourceMode === false)
  editor.toggleSource(); const t1 = editor.sourceMode
  editor.toggleSource(); const t2 = editor.sourceMode
  ok('toggleSource 可来回切换', t1 === true && t2 === false, `${t1}->${t2}`)

  // 预览 / 全屏
  editor.openPreview()
  ok('openPreview 打开预览', editor.previewMode === true && !!document.querySelector('.ke-preview'))
  editor.closePreview()
  const pv = document.querySelector('.ke-preview')
  ok('closePreview 关闭预览', editor.previewMode === false && (!pv || pv.hidden === true),
     `previewMode=${editor.previewMode} hidden=${pv ? pv.hidden : 'no-el'}`)

  // 网络链接插入媒体（本轮新增能力）
  editor.setContent('<p></p>')
  editor.focus()
  editor.insertImage('https://example.com/a.png', '示例图')
  ok('insertImage(url) 链接插图', editor.getHTML().includes('example.com/a.png'), editor.getHTML().slice(0, 160))
  editor.insertVideo('https://example.com/v.mp4', '示例视频')
  ok('insertVideo(url) 链接插视频', editor.getHTML().includes('example.com/v.mp4'), editor.getHTML().slice(0, 160))

  // 媒体计数
  ok('counts 统计图片/视频', editor.counts().images >= 1 && editor.counts().videos >= 1, JSON.stringify(editor.counts()))

  // exportHtml：清理编辑器内部属性后返回 HTML 片段
  try {
    const exported = window.KEditor.exportHtml('<p data-k-id="x" contenteditable="true">hi</p>')
    ok('exportHtml 清理内部属性', typeof exported === 'string' && exported.includes('hi') &&
       !exported.includes('data-k-id') && !exported.includes('contenteditable'), exported)
  } catch (e) { ok('exportHtml 清理内部属性', false, e.message) }

  // 事件
  let changeFired = false
  const off = editor.on('change', () => { changeFired = true })
  editor.setContent('<p>触发变更</p>')
  await new Promise((r) => setTimeout(r, 400))
  ok('on(change) 事件触发', changeFired)
  off && off()

  // 上传工具类导出
  ok('ChunkUploader 导出', typeof window.KEditor.ChunkUploader === 'function')
  ok('SimpleUploader 导出', typeof window.KEditor.SimpleUploader === 'function')
  ok('UploadPipeline 导出', typeof window.KEditor.UploadPipeline === 'function')
  ok('createSimpleUploader / createChunkUploader 导出',
     typeof window.KEditor.createSimpleUploader === 'function' && typeof window.KEditor.createChunkUploader === 'function')
  ok('mockAdapter/httpAdapter/simpleAdapter 导出',
     typeof window.KEditor.mockAdapter === 'function' &&
     typeof window.KEditor.httpAdapter === 'function' &&
     typeof window.KEditor.simpleAdapter === 'function')
  ok('sanitizeHtml/formatHtml 导出',
     typeof window.KEditor.sanitizeHtml === 'function' && typeof window.KEditor.formatHtml === 'function')

  // 代码块：语言选择 + 语法高亮（本轮新增能力）
  ok('代码块 API 全部导出',
     ['highlightCode', 'listLanguages', 'normalizeLang', 'languageLabel', 'isCodeBlock'].every((k) => typeof window.KEditor[k] === 'function')
     && Array.isArray(window.KEditor.LANGUAGES))
  ok('内置语言清单 20 种', window.KEditor.listLanguages().length === 20, window.KEditor.listLanguages().length)
  ok('highlightCode 可用且产出 token', /ke-tok-kw/.test(window.KEditor.highlightCode('const a = 1', 'js')))
  ok('normalizeLang 认别名', window.KEditor.normalizeLang('mysql') === 'sql' && window.KEditor.normalizeLang('nope') === 'plaintext')
  editor.setContent('<pre data-k-lang="python"><code>def f():\n    return 1</code></pre>')
  const codeEl = editor.root.querySelector('pre code')
  ok('安装产物能高亮代码块', codeEl.querySelectorAll('span[class*="ke-tok-"]').length > 0,
     codeEl.querySelectorAll('span[class*="ke-tok-"]').length)
  const codeOut = editor.getHTML()
  ok('导出保持干净（无 token span、保留语言标记）',
     !/ke-tok-/.test(codeOut) && codeOut.includes('data-k-lang="python"'), codeOut.slice(0, 90))
  ok('codeLanguages() 返回语言清单', editor.codeLanguages().length === 20, editor.codeLanguages().length)
  editor.focus()
  const insertedPre = editor.insertCode('SELECT 1', 'sql')
  ok('insertCode 插入代码块并写入语言', !!insertedPre && insertedPre.getAttribute('data-k-lang') === 'sql',
     insertedPre && insertedPre.getAttribute('data-k-lang'))
  ok('insertCode 后光标在块内（getCodeLanguage）', editor.getCodeLanguage() === 'sql', editor.getCodeLanguage())
  ok('setCodeLanguage 切换语言', editor.setCodeLanguage('python') === 'python' && insertedPre.getAttribute('data-k-lang') === 'python',
     insertedPre.getAttribute('data-k-lang'))
  ok('isCodeBlock 识别代码块', window.KEditor.isCodeBlock(insertedPre) === true && window.KEditor.isCodeBlock(editor.root) === false)

  // Markdown 导入：文件/文本 → HTML（本轮新增能力）
  ok('Markdown API 全部导出',
     ['markdownToHtml', 'markdownSummary', 'isMarkdownFile', 'readMarkdownFile', 'normalizeInsertMode', 'MARKDOWN_ACCEPT']
       .every((k) => k in window.KEditor))
  ok('markdownToHtml 产出正文规范 HTML',
     /<h1>标题<\/h1>/.test(window.KEditor.markdownToHtml('# 标题')) &&
     /<pre data-k-lang="javascript"><code class="language-javascript">/.test(window.KEditor.markdownToHtml('```js\nconst a = 1\n```')),
     window.KEditor.markdownToHtml('```js\nconst a = 1\n```'))
  ok('markdownToHtml 默认净化脚本', !/<script/i.test(window.KEditor.markdownToHtml('a\n\n<img src=x onerror=alert(1)>')))
  ok('isMarkdownFile 认 .md / .txt，不认图片',
     window.KEditor.isMarkdownFile({ name: 'a.md', type: '' }) &&
     !window.KEditor.isMarkdownFile({ name: 'a.png', type: 'image/png' }))
  ok('normalizeInsertMode 归一',
     window.KEditor.normalizeInsertMode('cursor') === 'cursor' && window.KEditor.normalizeInsertMode('bad') === 'replace')
  ok('工具栏含导入 Markdown 按钮', !!document.querySelector('.ke-tb [data-k-item="markdown"]'))
  const mdResult = await editor.importMarkdown('# 导入标题\n\n正文 **加粗**\n\n```js\nconst a = 1\n```\n\n| a | b |\n| --- | --- |\n| 1 | 2 |')
  ok('importMarkdown 转换并落盘',
     mdResult.ok && /<h1>导入标题<\/h1>/.test(editor.getHTML()) && !!editor.root.querySelector('table'),
     JSON.stringify({ ok: mdResult.ok, mode: mdResult.mode }))
  ok('导入的代码块已高亮且带上语言标记',
     editor.root.querySelectorAll('pre span[class*="ke-tok-"]').length > 0 &&
     editor.root.querySelector('pre').getAttribute('data-k-lang') === 'javascript',
     editor.root.querySelector('pre').getAttribute('data-k-lang'))
  ok('导出后高亮不落盘（可再次导入）',
     !/ke-tok-/.test(editor.getHTML()) && /<pre data-k-lang="javascript"/.test(editor.getHTML()))
  const mdFile = new File(['# 文件导入'], 'readme.md', { type: 'text/markdown' })
  const fileResult = await editor.importMarkdown(mdFile)
  ok('importMarkdown(File) 按文本读取并转换',
     fileResult.ok && fileResult.name === 'readme.md' && /文件导入/.test(editor.getHTML()),
     JSON.stringify({ ok: fileResult.ok, name: fileResult.name }))
  await editor.appendMarkdown('追加段落')
  ok('appendMarkdown 追加且保留原内容', /文件导入/.test(editor.getHTML()) && /追加段落/.test(editor.getHTML()))

  ok('destroy 可用', typeof editor.destroy === 'function')
}

/* ---------------- 3. ESM 动态导入（安装后的 es 产物） ---------------- */
try {
  const ns = await import('./node_modules/kyle-editor/dist/keditor.es.js')
  ok('ESM 默认导出可用', typeof ns.default === 'function')
  ok('ESM 具名导出完整', typeof ns.create === 'function' && typeof ns.sanitizeHtml === 'function', Object.keys(ns).length)
  ok('ESM 代码块 API 完整', typeof ns.highlightCode === 'function' && typeof ns.listLanguages === 'function' && Array.isArray(ns.LANGUAGES))
  const esmEditor = ns.create('#esm-box', { uploader: 'mock' })
  esmEditor.setContent('<p>ESM 路径正常</p>')
  ok('ESM create 可挂载', esmEditor.getText().includes('ESM'), esmEditor.getText().slice(0, 40))
  esmEditor.destroy()
  ok('ESM destroy 清理实例', !document.querySelector('#esm-box .ke-tb'))
} catch (e) {
  ok('ESM 动态导入', false, e.message)
}

/* ---------------- 4. Vue 3 UMD 组件 ---------------- */
try {
  const V = window.Vue
  const KV = window.KEditorVue
  ok('Vue UMD 全局存在', !!V && !!KV, KV ? Object.keys(KV).join(',') : 'undefined')
  const comp = KV.KEditorVue
  ok('具名导出 KEditorVue 为组件', !!(comp && comp.setup && comp.props && comp.props.modelValue),
     comp ? `setup=${typeof comp.setup} props=${Object.keys(comp.props || {}).join('|')}` : 'undefined')
  ok('默认导出可直接当组件用（自带 install）',
     !!(KV.default && KV.default.setup && typeof KV.default.install === 'function'),
     KV.default ? `setup=${typeof KV.default.setup} install=${typeof KV.default.install}` : 'undefined')
  ok('KEditorPlugin 具名导出', !!(KV.KEditorPlugin && typeof KV.KEditorPlugin.install === 'function'))

  const { createApp, ref, h, nextTick, resolveComponent } = V

  // 用法 A：app.use(default) + 全局 <k-editor> 标签（README 推荐的写法）
  const globalApp = createApp({
    setup() {
      const model = ref('<p>全局注册内容</p>')
      window.__GLOBAL_MODEL = model
      return () => h(resolveComponent('k-editor'), {
        modelValue: model.value,
        'onUpdate:modelValue': (v) => { model.value = v },
      })
    },
  })
  globalApp.use(KV.default)
  globalApp.mount('#vue-box')
  await new Promise((r) => setTimeout(r, 1000))
  const gContent = document.querySelector('#vue-box .ke-content')
  ok('app.use(default) 注册 <k-editor> 并渲染', !!gContent && gContent.textContent.includes('全局注册内容'),
     gContent ? gContent.textContent.slice(0, 40) : 'no .ke-content')
  globalApp.unmount()

  // 用法 B：把默认导出直接当组件（之前会静默渲染空白的陷阱）
  let inst = null
  const localApp = createApp({
    setup() {
      const model = ref('<p>Vue 初始内容</p>')
      const edRef = ref(null)
      inst = { model, edRef }
      return () => h('div', [h(KV.default, {
        ref: edRef,
        modelValue: model.value,
        'onUpdate:modelValue': (v) => { model.value = v },
        options: { uploader: 'mock' },
      })])
    },
  })
  localApp.config.errorHandler = (err, _vm, info) => results.push({ name: 'Vue 无未捕获错误', pass: false, extra: `${info}: ${err && err.message}` })
  localApp.mount('#vue-box')
  await new Promise((r) => setTimeout(r, 1200))

  const vueContent = document.querySelector('#vue-box .ke-content')
  ok('默认导出当组件可挂载编辑器', !!vueContent)
  ok('v-model 初值渲染', !!vueContent && vueContent.textContent.includes('Vue 初始内容'),
     vueContent ? vueContent.textContent.slice(0, 40) : 'no content')
  const ex = inst && inst.edRef.value
  ok('ref 暴露 editor 实例', !!(ex && ex.editor && typeof ex.editor.getHTML === 'function'),
     ex ? Object.keys(ex).slice(0, 8).join(',') : 'null ref')
  ok('ref 暴露 getHTML/setContent', !!(ex && typeof ex.getHTML === 'function' && typeof ex.setContent === 'function'))
  if (ex && ex.setContent) {
    ex.setContent('<p>Vue 写入内容</p>')
    await nextTick()
    ok('ref.setContent 生效', ex.getHTML().includes('Vue 写入内容'), ex.getHTML().slice(0, 60))
    // 外部改 v-model 应同步到编辑器
    inst.model.value = '<p>外部双向绑定</p>'
    await nextTick()
    await new Promise((r) => setTimeout(r, 300))
    ok('v-model 外部赋值同步到编辑器', ex.getHTML().includes('外部双向绑定'), ex.getHTML().slice(0, 60))
  }
  localApp.unmount()
  ok('unmount 后卸载编辑器', !document.querySelector('#vue-box .ke-tb'))

  // 用法 C：不传 v-model（npm 安装后最常见场景）——正文应为空，且不得把编辑器自身 DOM 当内容
  const emptyApp = createApp({
    setup() {
      return () => h('div', [h(KV.default, { options: { uploader: 'mock', placeholder: 'EMPTY_PH' } })])
    },
  })
  emptyApp.mount('#vue-box')
  await new Promise((r) => setTimeout(r, 900))
  const emptyRoot = document.querySelector('#vue-box [data-ke-root]')
  ok('未传 v-model 时正文为空占位', !!emptyRoot && emptyRoot.innerHTML === '<p><br></p>',
     emptyRoot ? emptyRoot.innerHTML.slice(0, 70) : 'no root')
  ok('未传 v-model 时不含编辑器自身 DOM',
     !!emptyRoot && !emptyRoot.querySelector('.ke-tb,.ke-status,.ke-preview,.ke-dropzone'),
     emptyRoot ? emptyRoot.innerHTML.slice(0, 70) : 'no root')
  ok('未传 v-model 时 placeholder 生效', !!emptyRoot && emptyRoot.classList.contains('ke-is-empty'),
     emptyRoot ? emptyRoot.className : 'no root')
  emptyApp.unmount()
} catch (e) {
  ok('Vue UMD 组件挂载', false, e.message)
}

/* ---------------- 自定义工具栏按钮（安装后产物） ---------------- */
try {
  const box = document.createElement('div')
  document.body.appendChild(box)
  let selectEvent = null
  const cbEditor = window.KEditor.create(box, {
    value: '<p>光标处插入</p>',
    uploader: 'mock',
    customButtons: [
      {
        name: 'tpl',
        text: '模板',
        title: '插入模板',
        options: [
          { value: 'opening', label: '开场白', desc: '问候 + 导读' },
          { value: 'evil', label: '危险项', url: 'javascript:alert(1)' },
        ],
        link: { url: 'https://mp.weixin.qq.com/s/tpl-{value}', text: '【{label}】' },
      },
      { name: 'api', text: '栏目', url: 'columns.json', link: true, insert: 'link' },
    ],
  })
  await new Promise((r) => setTimeout(r, 200))
  ok('自定义下拉按钮已渲染到工具栏',
     !!box.querySelector('[data-k-item="tpl"]') && !!box.querySelector('[data-k-item="api"]'))

  cbEditor.on('customselect', (p) => { selectEvent = p })

  // 静态配置 + 链接模板
  cbEditor.toolbar.openCustom('tpl')
  await new Promise((r) => setTimeout(r, 200))
  const tplRows = Array.from(document.querySelectorAll('.ke-pop:not([hidden]) .ke-sel-row'))
  ok('静态 options 面板列出选项', tplRows.length === 2, tplRows.length)
  tplRows[0].click()
  await new Promise((r) => setTimeout(r, 200))
  ok('选中后按模板插入跳转链接',
     /<a[^>]+href="https:\/\/mp\.weixin\.qq\.com\/s\/tpl-opening"/.test(cbEditor.getHTML()),
     cbEditor.getHTML().slice(0, 140))
  ok('customselect 事件载荷完整',
     selectEvent && selectEvent.name === 'tpl' && selectEvent.item.label === '开场白' && selectEvent.action === 'link',
     JSON.stringify(selectEvent && { n: selectEvent.name, a: selectEvent.action }))
  ok('按钮文案回显选中项', /开场白/.test(box.querySelector('[data-k-item="tpl"]').textContent),
     box.querySelector('[data-k-item="tpl"]').textContent.trim())

  // 危险协议不得生成链接
  cbEditor.toolbar.openCustom('tpl')
  await new Promise((r) => setTimeout(r, 200))
  const evil = Array.from(document.querySelectorAll('.ke-pop:not([hidden]) .ke-sel-row')).find((r2) => /危险项/.test(r2.textContent))
  evil.click()
  await new Promise((r) => setTimeout(r, 200))
  ok('javascript: 地址被拒绞，不生成链接', !/javascript:/i.test(cbEditor.getHTML()), cbEditor.getHTML().slice(-120))

  // 从接口读取（真实 fetch）
  cbEditor.toolbar.openCustom('api')
  await new Promise((r) => setTimeout(r, 900))
  const apiRows = Array.from(document.querySelectorAll('.ke-pop:not([hidden]) .ke-sel-row'))
  ok('url 接口读取并在安装环境中可用', apiRows.length === 2, apiRows.length)
  if (apiRows.length) {
    apiRows[0].click()
    await new Promise((r) => setTimeout(r, 200))
    ok('接口项自带地址插入成功', /href="https:\/\/mp\.weixin\.qq\.com\/s\/tech"/.test(cbEditor.getHTML()),
       cbEditor.getHTML().slice(-140))
  }

  // 运行时 API
  const added = cbEditor.addButton({ name: 'late', text: '后加', options: [{ value: 'z', label: '后加项' }], link: 'https://x.com/{value}' })
  await new Promise((r) => setTimeout(r, 120))
  ok('addButton 运行时新增', !!added && !!box.querySelector('[data-k-item="late"]'))
  cbEditor.setButtonOptions('late', [{ value: 'y', label: '换数据' }])
  cbEditor.toolbar.openCustom('late')
  await new Promise((r) => setTimeout(r, 200))
  ok('setButtonOptions 外部灌入数据',
     Array.from(document.querySelectorAll('.ke-pop:not([hidden]) .ke-sel-row')).some((r2) => /换数据/.test(r2.textContent)))
  cbEditor.popover.close()
  ok('removeButton 移除', cbEditor.removeButton('late') === true && !box.querySelector('[data-k-item="late"]'))

  // 位置与版心（安装后环境同样可用）
  const posBox = document.createElement('div')
  posBox.style.cssText = 'width:1200px'
  document.body.appendChild(posBox)
  const posEditor = window.KEditor.create(posBox, {
    value: '<p>x</p>',
    customButtons: [
      { name: 'atStart', text: '置顶', position: 'start', options: ['a'] },
      { name: 'afterLink', text: '链接后', position: { after: 'link' }, options: ['b'] },
      { name: 'inTail', text: '尾栏', position: 'tail', options: ['c'] },
      { name: 'plain', text: '默认', options: ['d'] },
    ],
  })
  await new Promise((r) => setTimeout(r, 120))
  const names = posEditor.toolbar.buttonNodes().map((n) => n.dataset.kItem)
  ok('position: start 生效', names[0] === 'atStart', names.slice(0, 3).join(','))
  ok('position: {after:link} 生效', names[names.indexOf('link') + 1] === 'afterLink', '')
  ok('position: tail 进入吸附尾栏', !!posBox.querySelector('.ke-tb-tail [data-k-item="inTail"]'), '')
  ok('未写 position 仍到主区末尾',
     Array.from(posEditor.toolbar.groupEl.children).filter((n) => n.dataset.kItem).pop().dataset.kItem === 'plain', '')
  ok('normalizePosition 随包导出', typeof window.KEditor.normalizePosition === 'function'
     && JSON.stringify(window.KEditor.normalizePosition({ after: 'link' })) === '{"after":"link"}', '')
  posEditor.moveButton('plain', { before: 'undo' })
  ok('moveButton 移动已存按钮', posEditor.toolbar.buttonNodes()[1].dataset.kItem === 'plain', '')
  ok('默认工具栏不含预览按钮', window.KEditor.DEFAULT_TOOLBAR.indexOf('preview') < 0, '')
  ok('fluid 版心默认开启', posEditor.paperOptions().mode === 'fluid'
     && posBox.querySelector('.ke-paper').classList.contains('ke-is-fluid'), JSON.stringify(posEditor.paperOptions()))
  const fixedW = (() => { posEditor.setPaper({ mode: 'fixed' }); return posBox.querySelector('.ke-paper').offsetWidth })()
  posEditor.setPaper({ mode: 'fluid', gap: 0 })
  const fluidW = posBox.querySelector('.ke-paper').offsetWidth
  ok('setPaper 运行时切换版心模式', fixedW === 741 && fluidW >= fixedW, `fixed=${fixedW} fluid=${fluidW}`)
  posEditor.destroy()
  posBox.remove()

  cbEditor.destroy()
  box.remove()
} catch (e) {
  ok('自定义按钮整体流程', false, e.message)
}

/* ---------------- 上传：普通上传 / 分片上传（安装后的真实产物） ---------------- */
// 需求：上传分为普通上传与分片上传，可单独配置；分片上传只需一个接口，响应里 url 非空即成功
try {
  const realFetch = window.fetch
  try {
    const CS = 64 * 1024
    const calls = []
    let respondUrl = true // 关掉后模拟「接口从不返回 url」
    window.fetch = async (url, init = {}) => {
      const form = init.body instanceof FormData ? init.body : null
      const query = new URL(String(url), location.href).searchParams
      const hasIndex = form ? form.has('index') : query.has('index')
      const index = Number(form ? form.get('index') : query.get('index'))
      const total = Number(form ? form.get('total') : query.get('total'))
      calls.push({ url: String(url), index, hasIndex, method: init.method, identifier: form && form.get('identifier'), chunk: form && form.get('file') })
      // 服务端：分片收齐最后一片时返回地址；普通上传（无 index）一次就返回
      const payload = respondUrl && (hasIndex ? index === total - 1 : true) ? { code: 0, data: { url: 'https://cdn.kyle.dev/single.png' } } : {}
      return { ok: true, status: 200, statusText: 'OK', text: async () => JSON.stringify(payload) }
    }
    const file = new File([new Uint8Array(CS * 3)], 'single.png', { type: 'image/png' })
    const up = window.KEditor.createChunkUploader('/api/upload', { chunkSize: CS, concurrency: 1, retries: 0 })
    ok('安装包：分片上传只配一个地址', up.adapter.completeOnUrl === true && up.mode === 'chunk', `completeOnUrl=${up.adapter.completeOnUrl}`)
    const res = await up.upload(file)
    ok('安装包：接口返回 url 即上传成功', res.url === 'https://cdn.kyle.dev/single.png' && res.mode === 'chunk', res.url)
    ok('安装包：分片全打到同一地址且字段齐备',
       calls.length === 3 && calls.every((c) => c.method === 'POST' && c.url === '/api/upload' && c.identifier && c.chunk && c.chunk.size > 0),
       `${calls.length} 次 method=${calls[0] && calls[0].method}`)
    calls.length = 0
    respondUrl = false
    let err = ''
    try {
      await window.KEditor.createChunkUploader({ type: 'http', url: '/api/upload' }, { chunkSize: CS, concurrency: 1, retries: 0 }).upload(file)
    } catch (e) { err = e.message }
    ok('安装包：接口没有 url 时判定失败', /未返回 url/.test(err), err.slice(0, 60))

    // 普通上传：整个文件一次请求
    calls.length = 0
    respondUrl = true
    const whole = window.KEditor.createSimpleUploader('/api/upload')
    const wholeRes = await whole.upload(file)
    ok('安装包：普通上传整个文件只请求一次', calls.length === 1 && !calls[0].hasIndex && calls[0].chunk.size === file.size, `${calls.length} 次 / ${calls[0] && calls[0].chunk.size}B`)
    ok('安装包：普通上传响应 url 即结果', wholeRes.url === 'https://cdn.kyle.dev/single.png' && wholeRes.mode === 'normal' && wholeRes.chunks === 1, `${wholeRes.url} / ${wholeRes.mode}`)

    // 旧三接口配置：搮截并报错
    let legacyErr = ''
    try { window.KEditor.httpAdapter({ initUrl: '/i', chunkUrl: '/c', completeUrl: '/d' }) } catch (e) { legacyErr = e.message }
    ok('安装包：已移除的三接口配置报错提示', /单接口/.test(legacyErr) && /initUrl/.test(legacyErr), legacyErr.slice(0, 60))
  } finally {
    window.fetch = realFetch
  }
} catch (e) {
  ok('上传（普通 / 分片）整体流程', false, e.message)
}

/* ---------------- 内容区高度（安装后产物） ---------------- */
try {
  const LONG = ('<p>' + '自适应高度测试内容。'.repeat(8) + '</p>').repeat(40)
  const autoBox = document.createElement('div')
  const fixBox = document.createElement('div')
  autoBox.style.cssText = fixBox.style.cssText = 'width:900px'
  document.body.append(autoBox, fixBox)
  const autoEd = window.KEditor.create(autoBox, { value: LONG, uploader: 'mock' })
  const fixEd = window.KEditor.create(fixBox, { value: LONG, height: 460, uploader: 'mock' })
  await new Promise((r) => setTimeout(r, 120))
  ok('安装包：不配 height 时内容区自适应擑开', autoEd.el.classList.contains('ke-is-auto') && autoEd.paperEl.offsetHeight > 1500 && !autoEd.scrollEl.style.height,
     `paper=${autoEd.paperEl.offsetHeight} inline="${autoEd.scrollEl.style.height}"`)
  ok('安装包：自适应模式下无内部滚动', autoEd.scrollEl.scrollHeight <= autoEd.scrollEl.clientHeight + 1,
     `sh=${autoEd.scrollEl.scrollHeight} ch=${autoEd.scrollEl.clientHeight}`)
  ok('安装包：配置 height 时固定高度并内部滚动', fixEd.scrollEl.style.height === '460px' && fixEd.scrollEl.scrollHeight > fixEd.scrollEl.clientHeight + 1,
     `inline=${fixEd.scrollEl.style.height}`)
  ok('安装包：setHeight 可在固定/自适应间切换', autoEd.setHeight(300) === 300 && !autoEd.el.classList.contains('ke-is-auto') && autoEd.setHeight(0) === 0 && autoEd.el.classList.contains('ke-is-auto'),
     JSON.stringify(autoEd.heightOptions()))
  autoEd.destroy()
  fixEd.destroy()
  autoBox.remove()
  fixBox.remove()
} catch (e) {
  ok('内容区高度（自适应 / 固定）', false, e.message)
}

/* ---------------- 汇总 ---------------- */
window.__RESULT.done = true
window.__RESULT.total = results.length
window.__RESULT.passed = results.filter((r) => r.pass).length
log(`${window.__RESULT.passed}/${window.__RESULT.total} 通过`)
results.filter((r) => !r.pass).forEach((r) => log('FAIL ' + r.name + ' :: ' + r.extra))
</script>
