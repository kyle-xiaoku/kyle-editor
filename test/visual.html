<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KEditor 视觉验证</title>
    <link rel="stylesheet" href="../demo/assets/demo.css" />
    <style>
      body { background: #eef0f3; }
      main { max-width: 1100px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>视觉验证</h1>
      <span class="tag" id="state-tag">state=default</span>
      <div class="nav"><a class="btn" href="../demo/script.html">返回 Demo</a></div>
    </div>
    <main>
      <div class="card">
        <h2 id="desc">编辑器外观</h2>
        <div class="body tight"><div id="editor"></div></div>
      </div>
    </main>

    <script src="../dist/keditor.umd.js"></script>
    <script>
      const params = new URLSearchParams(location.search)
      const state = params.get('state') || 'rich'
      document.getElementById('state-tag').textContent = 'state=' + state
      // 滚动引导气泡只弹一次，截图前清掉记忆以便每次都能拍到
      if (state.startsWith('scroll')) {
        try { localStorage.removeItem('keditor.toolbarScrollHint') } catch (e) { /* 忽略 */ }
      }

      const RICH = `
        <h2>微信公众号排版风格</h2>
        <p>正文默认 <span style="color:#07c160">17px</span>、行距 1.75，支持<span style="background-color:#fef08a">高亮标注</span>、<strong>加粗</strong>、<em>斜体</em>与<del>删除线</del>。</p>
        <h3>小标题</h3>
        <blockquote>「好的编辑器应当让人专注于内容本身。」</blockquote>
        <ul><li>拖拽 / 粘贴即可上传</li><li>大文件自动分片，失败自动重试</li></ul>
        <ol><li>选择文件</li><li>分片并发传输</li><li>合并返回地址</li></ol>
        <table><tbody>
          <tr><th>能力</th><th>说明</th></tr>
          <tr><td>分片上传</td><td>默认 1MB/片，可配并发与重试</td></tr>
          <tr><td>源码模式</td><td>格式化、复制、可直接改写</td></tr>
        </tbody></table>
        <pre><code>const editor = KEditor.create('#editor', {\n  uploader: { type: 'http', initUrl: '/api/upload/init' }\n})</code></pre>
        <p>再看一个<A href="https://mp.weixin.qq.com" target="_blank" rel="noopener noreferrer">外链</A>与分割线：</p>
        <hr>
        <p style="text-align:center"><span style="color:#8a8f99">居中说明文字</span></p>`

      // 仅自定义按钮相关的截图状态才挂这些按钮，避免扰动其他状态的截图
      const CUSTOM_STATES = ['custom', 'customload', 'customerr']
      // 宽屏对比状态：拉满容器宽度，才能看出版心是否随容器生长
      if (state === 'wide' || state === 'widefix') document.querySelector('main').style.maxWidth = 'none'
      const customButtons = CUSTOM_STATES.includes(state)
        ? [
            {
              name: 'column',
              text: '栏目',
              title: '插入栏目链接',
              note: '接口数据',
              searchable: true,
              ...(state === 'customload'
                ? { load: () => new Promise((r) => setTimeout(() => r([]), 8000)) }
                : state === 'customerr'
                  ? { url: 'fixtures/not-exist.json', cache: false }
                  : {
                      options: [
                        { value: 'tech', label: '技术前沿', desc: '研发动态与技术解读', url: 'https://mp.weixin.qq.com/s/demo-tech' },
                        { value: 'product', label: '产品更新', desc: '版本发布与功能说明', url: 'https://mp.weixin.qq.com/s/demo-product' },
                        { value: 'case', label: '客户案例', desc: '落地实践与效果数据', group: '内容运营', url: 'https://mp.weixin.qq.com/s/demo-case' },
                        { value: 'activity', label: '活动预告', desc: '直播、沙龙与报名', group: '内容运营', url: 'https://mp.weixin.qq.com/s/demo-activity' },
                        { value: 'archived', label: '已归档栏目', desc: '不再更新，仅供查看', disabled: true },
                      ],
                    }),
              link: true,
            },
          ]
        : state === 'posbtn'
          ? [
              { name: 'atStart', text: '置顶', position: 'start', options: [{ value: 'a', label: '置顶项' }] },
              { name: 'afterLink', text: '链接后', position: { after: 'link' }, options: [{ value: 'b', label: '链接后项' }] },
              { name: 'beforeImg', text: '图片前', position: { before: 'image' }, options: [{ value: 'c', label: '图片前项' }] },
              { name: 'inTail', text: '尾栏', position: 'tail', options: [{ value: 'd', label: '尾栏项' }] },
              { name: 'byIdx', text: '索引2', position: 2, options: [{ value: 'e', label: '索引项' }] },
            ]
          : []

      const editor = KEditor.create('#editor', {
        value: RICH,
        height: 520,
        placeholder: '开始撰写内容…',
        // 上传中状态故意限速，便于截图观察分片进度
        uploader: state === 'uploading' ? KEditor.mockAdapter({ speed: 0.5, latency: 420 }) : 'mock',
        upload: { chunkSize: 200 * 1024, concurrency: 3 },
        image: { compress: false },
        paperMode: state === 'widefix' ? 'fixed' : 'fluid',
        customButtons,
      })
      window.__editor = editor

      function noiseFile(name, type, size) {
        const bytes = new Uint8Array(size)
        crypto.getRandomValues(bytes.subarray(0, Math.min(size, 65536)))
        for (let i = 65536; i < size; i += 1) bytes[i] = bytes[i % 65536]
        return new File([bytes], name, { type })
      }
      function canvasFile(name, w, h, color, label) {
        const c = document.createElement('canvas')
        c.width = w
        c.height = h
        const ctx = c.getContext('2d')
        const g = ctx.createLinearGradient(0, 0, w, h)
        g.addColorStop(0, color)
        g.addColorStop(1, '#1f2329')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, w, h)
        ctx.fillStyle = '#fff'
        ctx.font = `600 ${Math.round(h / 6)}px sans-serif`
        ctx.fillText(label, 32, h / 2)
        return new Promise((resolve) => c.toBlob((blob) => resolve(new File([blob], name, { type: 'image/png' })), 'image/png'))
      }

      // 让 window.__ready 供截图脚本等待
      window.__ready = false
      async function boot() {
        if (state === 'rich') {
          document.getElementById('desc').textContent = '排版效果 + 已完成图片'
          const img = await canvasFile('cover.png', 900, 380, '#07c160', 'KEditor 图片')
          await editor.upload(img, 'image')
        } else if (state === 'uploading') {
          document.getElementById('desc').textContent = '上传中：分片进度占位块（大文件正在传输）'
          editor.focus()
          editor.setContent(RICH + '<p>下面正在上传：</p>')
          editor.upload(await canvasFile('photo-a.png', 720, 420, '#2f6fed', '图片上传中'), 'image')
          editor.upload(noiseFile('lecture-demo.mp4', 'video/mp4', 2400 * 1024), 'video')
          await new Promise((r) => setTimeout(r, 1200))
          editor.scrollEl.scrollTop = editor.scrollEl.scrollHeight
        } else if (state === 'bubble') {
          document.getElementById('desc').textContent = '图片气泡工具条（点击已上传图片）'
          editor.setContent('<p>选中图片后会出现快捷操作条：</p>')
          const img = await canvasFile('pic.png', 760, 340, '#ed8936', '选中图片后的浮层')
          await editor.upload(img, 'image')
          const node = editor.root.querySelector('[data-k-media="image"]')
          const pic = node.querySelector('img')
          pic.style.width = '60%'
          pic.style.marginLeft = 'auto'
          pic.style.marginRight = 'auto'
          pic.style.borderRadius = '10px'
          editor.scrollEl.scrollTop = 0
          node.dispatchEvent(new MouseEvent('click', { bubbles: true }))
        } else if (state === 'resize') {
          document.getElementById('desc').textContent = '图片拖拽缩放：拖动右下角圆形把手，实时显示宽度百分比'
          editor.setContent('<p>拖动图片右下角的圆形把手即可等比缩放：</p>')
          const img = await canvasFile('rs.png', 700, 300, '#4a5568', '可缩放图片')
          await editor.upload(img, 'image')
          const node = editor.root.querySelector('[data-k-media="image"]')
          node.querySelector('img').style.width = '80%'
          editor.scrollEl.scrollTop = 0
          node.dispatchEvent(new MouseEvent('click', { bubbles: true }))
          await new Promise((r) => setTimeout(r, 120))
          const hb = editor.bubble.resizeEl.getBoundingClientRect()
          const cx = hb.left + hb.width / 2
          const cy = hb.top + hb.height / 2
          editor.bubble.resizeEl.dispatchEvent(new PointerEvent('pointerdown', { clientX: cx, clientY: cy, button: 0, bubbles: true }))
          editor.bubble.resizeEl.dispatchEvent(new PointerEvent('pointermove', { clientX: cx - 130, clientY: cy, bubbles: true }))
        } else if (state === 'align') {
          document.getElementById('desc').textContent = '图片缩小后居中：点工具栏「居中」对图片生效（此前只有气泡能居中）'
          editor.setContent('<p>图片缩小到 50% 后，点工具栏「居中」按钮即可让图片在正文中居中（按钮同时高亮）：</p>')
          const img = await canvasFile('al.png', 640, 260, '#07c160', '缩小后居中')
          await editor.upload(img, 'image')
          const node = editor.root.querySelector('[data-k-media="image"]')
          const pic = node.querySelector('img')
          pic.style.width = '50%'
          pic.style.maxWidth = '100%'
          node.dispatchEvent(new MouseEvent('click', { bubbles: true }))
          await new Promise((r) => setTimeout(r, 80))
          editor.commands.setAlign('center')
          editor.scrollEl.scrollTop = 0
        } else if (state === 'source') {
          document.getElementById('desc').textContent = 'HTML 源码模式（格式化 + 可编辑）'
          editor.enterSource()
        } else if (state === 'color') {
          document.getElementById('desc').textContent = '字体颜色面板（点击工具栏「A」直接展开，含最近使用 / 主题色 / 标准色 / 自定义）'
          const target = editor.root.querySelector('h1') || editor.root.querySelector('p')
          const range = document.createRange()
          range.selectNodeContents(target.firstChild || target)
          const sel = window.getSelection()
          sel.removeAllRanges()
          sel.addRange(range)
          editor.toolbar.buttons.get('foreColor').click()
        } else if (state === 'heading') {
          document.getElementById('desc').textContent = '段落样式下拉：每一档都写清用途与字号'
          editor.toolbar.buttons.get('heading').click()
        } else if (state === 'media') {
          document.getElementById('desc').textContent = '图片插入面板：本地上传 / 网络链接双页签'
          editor.setContent('<p>点工具栏图片按钮，可直接上传，也能粘贴网络图片地址。</p>')
          editor.toolbar.buttons.get('image').click()
        } else if (state === 'link') {
          document.getElementById('desc').textContent = '视频插入面板：网络链接页签（自动校验可访问性）'
          editor.setContent('<p>视频同样支持直接填入播放地址，不走上传。</p>')
          editor.toolbar.buttons.get('video').click()
          await new Promise((r) => setTimeout(r, 60))
          editor.popover.el.querySelectorAll('.ke-tab')[1].click()
          const urlInput = editor.popover.el.querySelector('.ke-tab-body:not([hidden]) .ke-input')
          urlInput.value = 'https://media.w3.org/2013/05/sintel/trailer.mp4'
          urlInput.dispatchEvent(new Event('input'))
          await new Promise((r) => setTimeout(r, 900))
        } else if (state === 'custom') {
          document.getElementById('desc').textContent = '自定义下拉按钮：接口/静态数据 + 分组 + 搜索 + 选中插入跳转链接'
          editor.setContent('<p>选中一个栏目，会在光标处插入对应的跳转链接。</p>')
          editor.toolbar.openCustom('column')
          await new Promise((r) => setTimeout(r, 200))
        } else if (state === 'customload') {
          document.getElementById('desc').textContent = '自定义下拉按钮：接口加载中（骨架屏）'
          editor.toolbar.openCustom('column')
          await new Promise((r) => setTimeout(r, 260))
        } else if (state === 'customerr') {
          document.getElementById('desc').textContent = '自定义下拉按钮：接口失败提示 + 重试'
          editor.toolbar.openCustom('column')
          await new Promise((r) => setTimeout(r, 700))
        } else if (state === 'preview') {
          document.getElementById('desc').textContent = '预览模式（电脑屏宽 677px）'
          editor.openPreview()
          editor.previewPanel.setDevice('pc')
        } else if (state === 'posbtn') {
          document.getElementById('desc').textContent =
            '自定义按钮位置：置顶 / 链接后 / 图片前 / 索引 2 / 右侧尾栏（尾栏末项 = 尾栏）'
        } else if (state === 'wide') {
          document.getElementById('desc').textContent =
            '宽屏版心 fluid（默认）：版心随容器生长，两侧留白恒定 24px'
          await new Promise((r) => setTimeout(r, 150))
        } else if (state === 'widefix') {
          document.getElementById('desc').textContent =
            '宽屏版心 fixed（options.paperMode）：版心恒定 741px，两侧大片空白（旧行为）'
          await new Promise((r) => setTimeout(r, 150))
        } else if (state === 'scroll' || state === 'scroll2') {
          document.getElementById('desc').textContent =
            state === 'scroll'
              ? '工具栏溢出（静止）：常显滚动条 + 右侧阴影提示还有工具 + 首次引导气泡'
              : '工具栏溢出（滑到最右）：左侧渐隐提示还有内容，右侧阴影自动消失'
          editor.scrollEl.scrollTop = 0
          await new Promise((r) => setTimeout(r, 200))
          if (state === 'scroll2') {
            editor.tbEl.scrollLeft = editor.tbEl.scrollWidth
            editor.toolbar.hideScrollHint()
            await new Promise((r) => setTimeout(r, 400))
          }
        }
        window.__ready = true
      }
      boot()
    </script>
  </body>
</html>
